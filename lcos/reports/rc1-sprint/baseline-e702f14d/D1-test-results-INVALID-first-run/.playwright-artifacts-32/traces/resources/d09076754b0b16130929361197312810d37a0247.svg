<?xml version="1.0" encoding="UTF-8"?>
<!-- Liquid Clips · nav · Clipper — mode chip with scissor-like crossed slits -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FF1A8C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-hidden="true">
  <!-- chip outline -->
  <rect x="3" y="6" width="18" height="12" rx="3"/>
  <!-- left scissor handle -->
  <circle cx="8" cy="14.5" r="1.6"/>
  <!-- right scissor handle -->
  <circle cx="16" cy="14.5" r="1.6"/>
  <!-- crossed blades meeting at apex -->
  <line x1="8" y1="14.5" x2="14" y2="9"/>
  <line x1="16" y1="14.5" x2="10" y2="9"/>
  <!-- mode dot -->
  <circle cx="12" cy="9" r=".9" fill="#FF1A8C" stroke="none"/>
</svg>
