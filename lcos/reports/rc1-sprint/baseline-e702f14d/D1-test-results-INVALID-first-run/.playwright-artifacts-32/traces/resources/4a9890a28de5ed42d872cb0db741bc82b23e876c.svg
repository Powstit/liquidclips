<?xml version="1.0" encoding="UTF-8"?>
<!-- Liquid Clips · nav · Engine — scanning blade across a clip strip -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FF1A8C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" role="img" aria-hidden="true">
  <!-- clip strip frame -->
  <rect x="3" y="7" width="18" height="10" rx="1.6"/>
  <!-- perforations top -->
  <line x1="6.5" y1="7" x2="6.5" y2="9.4"/>
  <line x1="12"  y1="7" x2="12"  y2="9.4"/>
  <line x1="17.5" y1="7" x2="17.5" y2="9.4"/>
  <!-- perforations bottom -->
  <line x1="6.5" y1="14.6" x2="6.5" y2="17"/>
  <line x1="12"  y1="14.6" x2="12"  y2="17"/>
  <line x1="17.5" y1="14.6" x2="17.5" y2="17"/>
  <!-- scan blade -->
  <line x1="14" y1="4" x2="9" y2="20"/>
</svg>
