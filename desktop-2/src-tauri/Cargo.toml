[package]
name = "liquid-clips-shell"
version = "2.3.69"
description = "Liquid Clips 2.0 raw shell"
authors = ["Liquid Clips"]
edition = "2021"

[lib]
name = "liquid_clips_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Batch C (2026-06-20) — `protocol-asset` feature lets the webview play
# clip preview .mp4 files from CLIPS_HOME via the `asset:` URL scheme.
# Required by ResultsGrid + Studio preview wiring (lands in Batch D).
# 2026-06-25 — `unstable` enables child-webview APIs (add_child, get_webview)
# that browse.rs needs to spawn a native WKWebView inside the main window
# for the in-app browser overlay. Matches legacy desktop's Tauri features.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P1-1F-b · native OS credential storage for the license JWT.
# macOS Keychain · Windows Credential Manager · Linux Secret Service.
# `apple-native` + `windows-native` keep the implementation free of
# external dbus/dconf requirements on those targets.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# P1-4-d · auto-update pipeline. `updater` is the minisign-verified
# bundle fetcher; `process` is required by `relaunch()` after a
# successful install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Batch C (2026-06-20) — fs plugin required by the `fs:*` capability set
# in `capabilities/default.json`. The sidecar writes project state to
# AppData; the frontend reads previews via the asset: protocol (enabled
# in tauri.conf.json) — not directly via fs — so this is mostly a forward
# enablement for batch D consumers. Plugin only adds ~150 KB to binary.
tauri-plugin-fs = "2"
# 2026-06-25 · browse panel native webview. Commerce-URL filter
# (App Store guideline 3.1.1) redirects /checkout, /pay, /billing,
# /upgrade, /subscribe, /purchase, /cart navigations to the system
# browser. See `src/browse.rs`.
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# 2026-07-09 · P0.1 · native file picker so the folder button in the
# InlineCreatePanel / UploadPortal opens a real macOS chooser. Feeds
# the same live drop path (bus.emit source:drop → GlobalDropConsumer →
# sidecar.startRun) instead of the old "picked-file.mp4" fake.
tauri-plugin-dialog = "2"
# 2026-06-25 · Runtime Update v1 · Phase 1.
# `reqwest` — manifest + bundle download. `sha2` — bundle hash verify.
# `flate2` + `tar` — untar the .tar.gz bundle. `dirs` — ~/Library/AppSupport
# resolution. `mime_guess` — Content-Type for the custom URI scheme handler.
# `minisign-verify` — already a transitive dep via tauri-plugin-updater;
# re-declared here so we can call it directly. See `src/runtime.rs`.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
dirs = "5"
mime_guess = "2"
minisign-verify = "0.2"
futures-util = "0.3"
base64 = "0.22"
# Sidecar bridge (Batch A · 2026-06-20) — Rust ⇄ Python JSON-RPC over stdio.
# `anyhow` for error chaining inside sidecar.rs.
# `tokio` with the full set the desktop sidecar.rs uses: io-util for line
# pumping, process for ChildStdin/Command, sync for Mutex/oneshot, plus
# macros + rt-multi-thread for the spawn primitives. Iron Gate IG-002.
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "sync"] }

# ─── FIX P0 · 2026-07-04 · release binary hardening ────────────────────
# Strips symbols · leaks no /Users/dipdip/ author paths · reduces attacker's
# code-map + patch surface. `lto=true` and `codegen-units=1` also shrink the
# binary and inline aggressively — reverse-engineering resistance.
# `panic=abort` prevents unwind-based info disclosure via crash reports.
[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
