<?xml version="1.0" encoding="UTF-8"?>
<!-- Liquid Clips · rim-streak — diagonal 115° fuchsia key-light sweep.
     Use as overlay on world / hero. screen-blend. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="rim-streak" gradientTransform="rotate(115 0.5 0.5)">
      <stop offset="0%"   stop-color="#FF1A8C" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FF1A8C" stop-opacity="0"/>
      <stop offset="48%"  stop-color="#FF1A8C" stop-opacity="0.12"/>
      <stop offset="52%"  stop-color="#FF8FCB" stop-opacity="0.20"/>
      <stop offset="56%"  stop-color="#FF1A8C" stop-opacity="0.12"/>
      <stop offset="70%"  stop-color="#FF1A8C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF1A8C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#rim-streak)"/>
</svg>
