<?xml version="1.0" encoding="UTF-8"?>
<!-- Liquid Clips · spotlight — pedestal uplight cone.
     Mission pedestal / hero focal point. screen-blend. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" role="presentation">
  <defs>
    <linearGradient id="spotlight-cone" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%"  stop-color="#FF1A8C" stop-opacity="0.86"/>
      <stop offset="40%" stop-color="#FF1A8C" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#FF1A8C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spotlight-base" cx="50%" cy="100%" r="50%">
      <stop offset="0%"  stop-color="#FF8FCB" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#FF1A8C" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FF1A8C" stop-opacity="0"/>
    </radialGradient>
    <filter id="spotlight-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#spotlight-glow)">
    <path d="M400 800 L260 60 L540 60 Z" fill="url(#spotlight-cone)"/>
  </g>
  <ellipse cx="400" cy="780" rx="220" ry="60" fill="url(#spotlight-base)"/>
</svg>
