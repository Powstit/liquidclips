<?xml version="1.0" encoding="UTF-8"?>
<!-- Liquid Clips · beam-cyan — rare cyan signal beam.
     Channels relay / Community holograms. screen-blend. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="presentation">
  <defs>
    <linearGradient id="beam-cy" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"  stop-color="#00E5FF" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#00E5FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beam-cy-bloom" cx="0%" cy="50%" r="32%">
      <stop offset="0%"  stop-color="#A5F4FF" stop-opacity="0.72"/>
      <stop offset="80%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="beam-cy-glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#beam-cy-glow)">
    <path d="M0 142 L36 142 L1180 116 L1180 184 L36 158 L0 158 Z" fill="url(#beam-cy)"/>
  </g>
  <rect width="1200" height="300" fill="url(#beam-cy-bloom)"/>
</svg>
