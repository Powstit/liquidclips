<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-label="Launching on Product Hunt · liquid/clips · drop one tape, open your workbench, join the reward">
  <title>liquid/clips · Launching on Product Hunt</title>

  <defs>
    <!-- room plate · fuchsia bloom on the left, orange bloom on the right -->
    <radialGradient id="bg-fx" cx="22%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#ff2bb0" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#ff2bb0" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ff2bb0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-ph" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#DA552F" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#DA552F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#DA552F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15131c" />
      <stop offset="100%" stop-color="#0a090f" />
    </linearGradient>
    <linearGradient id="cta-fx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2bb0" />
      <stop offset="55%" stop-color="#c70078" />
      <stop offset="100%" stop-color="#ff66c4" />
    </linearGradient>

    <!-- scanline texture overlay -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.25" />
    </pattern>

    <!-- invader sprite · the Liquid Clips pixel mark, drawn as SVG rects.
         Reads as the same mascot at /brand/invader.png without baking
         a raster in here. -->
    <symbol id="lc-invader" viewBox="0 0 22 14">
      <g fill="currentColor" shape-rendering="crispEdges">
        <!-- row 1 -->
        <rect x="3" y="0" width="2" height="2" />
        <rect x="17" y="0" width="2" height="2" />
        <!-- row 2 -->
        <rect x="5" y="2" width="2" height="2" />
        <rect x="15" y="2" width="2" height="2" />
        <!-- row 3 · top arms -->
        <rect x="3" y="4" width="2" height="2" />
        <rect x="5" y="4" width="2" height="2" />
        <rect x="7" y="4" width="8" height="2" />
        <rect x="15" y="4" width="2" height="2" />
        <rect x="17" y="4" width="2" height="2" />
        <!-- row 4 · body with eye holes -->
        <rect x="1" y="6" width="2" height="2" />
        <rect x="3" y="6" width="4" height="2" />
        <rect x="9" y="6" width="4" height="2" />
        <rect x="15" y="6" width="4" height="2" />
        <rect x="19" y="6" width="2" height="2" />
        <!-- row 5 -->
        <rect x="1" y="8" width="20" height="2" />
        <!-- row 6 · legs -->
        <rect x="3" y="10" width="2" height="2" />
        <rect x="9" y="10" width="4" height="2" />
        <rect x="17" y="10" width="2" height="2" />
        <!-- row 7 · feet -->
        <rect x="1" y="12" width="2" height="2" />
        <rect x="19" y="12" width="2" height="2" />
      </g>
    </symbol>
  </defs>

  <!-- BACKGROUND ROOM -->
  <rect width="1600" height="540" fill="url(#bg-room)" />
  <rect width="1600" height="540" fill="url(#bg-fx)" />
  <rect width="1600" height="540" fill="url(#bg-ph)" />
  <rect width="1600" height="540" fill="url(#scanlines)" opacity="0.55" />

  <!-- thin border + corner reticles -->
  <rect x="0.5" y="0.5" width="1599" height="539" fill="none" stroke="rgba(45,214,238,0.16)" stroke-width="1" />
  <!-- TL -->
  <path d="M 28 28 L 28 60 M 28 28 L 60 28" stroke="#2dd6ee" stroke-width="2" fill="none" stroke-linecap="square" />
  <!-- TR -->
  <path d="M 1572 28 L 1572 60 M 1572 28 L 1540 28" stroke="#2dd6ee" stroke-width="2" fill="none" stroke-linecap="square" />
  <!-- BL -->
  <path d="M 28 512 L 28 480 M 28 512 L 60 512" stroke="#2dd6ee" stroke-width="2" fill="none" stroke-linecap="square" />
  <!-- BR -->
  <path d="M 1572 512 L 1572 480 M 1572 512 L 1540 512" stroke="#2dd6ee" stroke-width="2" fill="none" stroke-linecap="square" />

  <!-- TOP EYEBROW · cyan mono · status + window -->
  <g transform="translate(800, 84)" text-anchor="middle"
     font-family="ui-monospace, Menlo, 'Geist Mono', monospace"
     font-size="20" letter-spacing="6" fill="#2dd6ee">
    <!-- pulse dot drawn as circle -->
    <circle cx="-235" cy="-7" r="6" fill="#2dd6ee">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text>LAUNCHING ON  ·  72H REWARD WINDOW  ·  LIMITED SLOTS</text>
  </g>

  <!-- LEFT BLOCK · LIQUID/CLIPS -->
  <g transform="translate(220, 230)">
    <!-- invader glow halo -->
    <circle cx="80" cy="50" r="130" fill="#ff2bb0" opacity="0.22">
      <animate attributeName="opacity" values="0.22;0.34;0.22" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <!-- the invader mark (sized 176 × 112 = 8× the 22 × 14 base) -->
    <g color="#ff2bb0" style="filter: drop-shadow(0 0 12px rgba(255,43,176,0.7));">
      <use href="#lc-invader" x="-8" y="-6" width="176" height="112" />
    </g>

    <!-- wordmark · liquid/clips -->
    <g transform="translate(0, 140)"
       font-family="Inter, ui-sans-serif, system-ui, sans-serif"
       font-weight="800" font-size="56" letter-spacing="-2">
      <text fill="#ecebf2">liquid</text>
      <text x="155" fill="#ff2bb0" style="filter: drop-shadow(0 0 14px rgba(255,43,176,0.55));">/</text>
      <text x="175" fill="#ecebf2">clips</text>
    </g>

    <!-- mono caption underneath -->
    <text x="0" y="208"
          font-family="ui-monospace, Menlo, 'Geist Mono', monospace"
          font-size="13" letter-spacing="3" fill="#8e8b9c">
      THE CLIPPING WORKBENCH  ·  v0.8.0
    </text>
  </g>

  <!-- CENTRE · "×" CONNECTOR -->
  <g transform="translate(800, 280)" text-anchor="middle">
    <circle r="44" fill="rgba(11,11,16,0.65)" stroke="rgba(45,214,238,0.45)" stroke-width="1.5" />
    <text font-family="Inter, ui-sans-serif" font-weight="800" font-size="42" fill="#ecebf2" dy="14">×</text>
    <!-- glow ring -->
    <circle r="56" fill="none" stroke="#2dd6ee" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="52;62;52" dur="3.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.10;0.35" dur="3.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- RIGHT BLOCK · PRODUCT HUNT -->
  <g transform="translate(1180, 200)">
    <!-- orange glow halo -->
    <circle cx="100" cy="80" r="140" fill="#DA552F" opacity="0.22">
      <animate attributeName="opacity" values="0.22;0.34;0.22" dur="3.6s" repeatCount="indefinite" />
    </circle>

    <!-- PH rounded square mark · orange #DA552F · white P -->
    <g style="filter: drop-shadow(0 12px 22px rgba(218,85,47,0.55));">
      <rect x="20" y="20" width="160" height="160" rx="46" ry="46" fill="#DA552F" />
      <!-- inner highlight -->
      <rect x="22" y="22" width="156" height="156" rx="44" ry="44" fill="none"
            stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
      <!-- the "P" path -->
      <path d="M 76 56 H 116 a 24 24 0 0 1 0 48 H 92 v 36 H 76 V 56 z m 16 16 v 16 h 20 a 8 8 0 0 0 0 -16 H 92 z"
            fill="#ffffff" />
    </g>

    <!-- wordmark · PRODUCT HUNT -->
    <g transform="translate(0, 240)"
       font-family="Inter, ui-sans-serif, system-ui, sans-serif"
       font-weight="800" font-size="32" letter-spacing="2" fill="#ecebf2">
      <text>PRODUCT</text>
      <text y="36" fill="#DA552F" style="filter: drop-shadow(0 0 10px rgba(218,85,47,0.55));">HUNT</text>
    </g>
  </g>

  <!-- BOTTOM TAGLINE · pink emphasis -->
  <g transform="translate(800, 480)" text-anchor="middle"
     font-family="Inter, ui-sans-serif, system-ui, sans-serif"
     font-weight="700" font-size="22" letter-spacing="-0.2">
    <text fill="#c8c4be">Drop one tape.</text>
    <text x="220" fill="#ff2bb0" style="filter: drop-shadow(0 0 12px rgba(255,43,176,0.6));">Open your workbench.</text>
    <text x="540" fill="#c8c4be">Join the reward.</text>
  </g>
</svg>
