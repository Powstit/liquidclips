# ───── IRON GATE IG-013 (inherited from desktop/) ─────
# Apple notarisation orchestrator for desktop-2. Paired with
# desktop-2/scripts/notarize.sh + desktop-2/scripts/sign-clean-macos-app.sh
# + desktop-2/scripts/package-signed-macos-artifacts.sh. The 6 secrets
# (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD,
# APPLE_TEAM_ID, TAURI_SIGNING_PRIVATE_KEY) on Powstit/Jnr-employee are the
# source of truth — already present (verified P1-4-d 2026-06-19).
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD is referenced for forward-compat; the
# current key is unpassphrased so the empty env var is fine.
# NEVER swap apple-actions/import-codesign-certs@v3 for an unversioned ref.
# NEVER drop `--options runtime --timestamp` from the codesign pass.
# Hardened runtime is mandatory; Apple rejects without it.
#
# ───── Coexistence note ─────
# Until legacy desktop/ retires, both workflows live side-by-side. Legacy
# fires on `v*.*.*` (release.yml). desktop-2 fires on `desktop-2-v*.*.*`
# (this file). At cutover, rename this trigger to `v*.*.*` and delete
# release.yml. Both publish to the same updater manifest endpoint
# (updates.liquidclips.app/latest.json) — newest tag wins.
#
# ───── Python sidecar (re-added 2026-06-24 for first real-sidecar ship) ─────
# desktop-2 references repo-root `python-sidecar/` via tauri.conf.json
# bundle.resources `../../python-sidecar/...`. Sidecar landed as a SUPERSET of
# legacy (BUG-017 P2 clip_count added). ffmpeg + ffprobe + whisper-tiny are
# gitignored (76MB + 76MB + 75MB) so CI fetches them on every run.
# GIPHY_API_KEY / PEXELS_API_KEY / PIXABAY_API_KEY still NOT carried — desktop-2
# does not yet expose the stock-asset features that need them.

name: Release desktop-2
on:
  push:
    tags:
      - 'desktop-2-v[0-9]+.[0-9]+.[0-9]+'
  # 2026-07-08 · v2.2.35 · manual-approval fallback for the flip-to-Latest
  # step. Tag-triggered runs build to DRAFT; a subsequent workflow_dispatch
  # run with `flip_tag` = the same tag flips the draft to Latest and cascades
  # into publish-manifest. Use this path when the repo tier doesn't grant
  # required-reviewer Environments (see REPORT.md).
  workflow_dispatch:
    inputs:
      flip_tag:
        description: "Existing draft release tag to flip to Latest (e.g. desktop-2-v2.2.35). Leave blank to build+draft only."
        required: false
        type: string

jobs:
  publish-tauri:
    # Only build on tag push. A workflow_dispatch run is the flip-to-Latest
    # path — the draft release from the original tag push is what we
    # promote; we don't rebuild.
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Per-arch native jobs — same matrix as legacy.
        target:
          - runner: macos-latest
            arch: aarch64
            rust_target: aarch64-apple-darwin
            slug: aarch64
          - runner: macos-15-intel
            arch: x86_64
            rust_target: x86_64-apple-darwin
            slug: x86_64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install frontend dependencies
        run: npm install
        working-directory: ./desktop-2

      - name: verify updater signing key matches tauri pubkey
        working-directory: ./desktop-2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          brew install minisign
          CANARY="$(mktemp)"
          PUBKEY_FILE="$(mktemp)"
          SIG_FILE="$(mktemp)"
          printf 'liquid-clips-updater-key-check\n' > "$CANARY"
          npx tauri signer sign "$CANARY"
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); fs.writeFileSync(process.argv[1], Buffer.from(c.plugins.updater.pubkey, 'base64'));" "$PUBKEY_FILE"
          base64 -d -i "$CANARY.sig" > "$SIG_FILE"
          minisign -Vm "$CANARY" -x "$SIG_FILE" -p "$PUBKEY_FILE"
          EXPECTED='B1E037066BFCE444'
          ACTUAL="$(sed -n 's/^untrusted comment: minisign public key: //p' "$PUBKEY_FILE" | tr -d '[:space:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "✗ updater pubkey fingerprint mismatch: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi
          echo "✓ updater signing secret matches tauri pubkey $ACTUAL"

      # Sidecar binaries are .gitignored (ffmpeg 76MB, ffprobe 76MB,
      # whisper-tiny 75MB) so CI must fetch them before the Tauri build — the
      # bundle.resources entries in tauri.conf.json hard-require these paths.
      # Falling back to brew + huggingface_hub keeps the workflow
      # self-contained (no third-party CDN auth, no LFS).
      # Paths anchored at REPO ROOT `python-sidecar/` (desktop-2 references
      # via ../../python-sidecar/ from src-tauri/).
      # 2026-08-07 · P0 fix — two confirmed bugs in the prior fetch:
      #   1. Homebrew's regular `ffmpeg` formula excludes libfreetype /
      #      fontconfig (brew's own caveat says so), so the `drawtext`
      #      filter used for every hook-text burn-in (all tiers) failed at
      #      runtime with "No such filter: 'drawtext'". Switched to
      #      `ffmpeg-full`, which carries those libs.
      #   2. Any Homebrew-built ffmpeg — full or regular — links dynamically
      #      against ~100 dylibs at absolute Cellar paths
      #      (/usr/local/Cellar/... or /opt/homebrew/Cellar/...). Those paths
      #      only exist on a machine with Homebrew AND these exact package
      #      versions installed — a real customer Mac without Homebrew would
      #      fail to even launch ffmpeg (`dyld: Library not loaded`). Tauri's
      #      bundler only copies the raw binary as a resource — it does not
      #      relink or bundle dependencies. dylibbundler walks the full
      #      dependency tree, copies every non-system dylib next to the
      #      binary, and rewrites load commands to @executable_path/lib/ so
      #      the result is fully self-contained. Verified locally: otool -L
      #      shows zero remaining Homebrew references, and a real drawtext
      #      burn-in encode succeeds with PATH stripped to /usr/bin:/bin
      #      (no Homebrew reachable at all).
      - name: fetch ffmpeg + ffprobe (mac sidecar binaries via brew, bundled standalone)
        if: matrix.target.os_kind == 'mac' || matrix.target.runner == 'macos-latest' || matrix.target.runner == 'macos-15-intel'
        run: |
          set -euo pipefail
          # 2026-08-15 · P0 fix — v2.3.23 shipped an ffprobe that crashed on
          # EVERY invocation ("Symbol not found: _av_strireplace") because
          # the bundled libavfilter dylib didn't match what ffprobe was
          # actually linked against. This step only ever verified ffmpeg
          # (the drawtext filter check below) — ffprobe was never executed
          # post-bundle, so a broken ffprobe sailed straight through CI and
          # into a real release. Root cause in dylibbundler's exact failure
          # mode wasn't reproducible outside CI; hardening two ways instead
          # of chasing it further:
          #   1. Force a clean lib/ dir every run (rm before mkdir) so no
          #      version-mismatched file can possibly survive across steps.
          #   2. Bundle ffmpeg and ffprobe in SEPARATE dylibbundler passes
          #      (still sharing one -d output dir) instead of one combined
          #      call — removes any chance of the two binaries' dependency
          #      walks interfering with each other.
          # The real backstop is the new "actually run ffprobe" check below
          # — if this exact bug (or any bundling bug) recurs, the build now
          # fails loudly here instead of shipping silently broken.
          rm -rf python-sidecar/bin/lib
          mkdir -p python-sidecar/bin/lib
          # Per-arch native fetch — each matrix runner pulls the brew ffmpeg
          # matching its own architecture. arm64 runner → arm64 binary;
          # x86_64 runner → x86_64 binary. The DMG built on this runner
          # therefore ships a native sidecar.
          brew install ffmpeg-full dylibbundler
          FFMPEG_FULL_PREFIX="$(brew --prefix ffmpeg-full)"
          cp -f "$FFMPEG_FULL_PREFIX/bin/ffmpeg"  python-sidecar/bin/ffmpeg
          cp -f "$FFMPEG_FULL_PREFIX/bin/ffprobe" python-sidecar/bin/ffprobe
          chmod +x python-sidecar/bin/ffmpeg python-sidecar/bin/ffprobe

          dylibbundler -od -b \
            -x python-sidecar/bin/ffmpeg \
            -d python-sidecar/bin/lib/ \
            -p '@executable_path/lib/'
          dylibbundler -od -b \
            -x python-sidecar/bin/ffprobe \
            -d python-sidecar/bin/lib/ \
            -p '@executable_path/lib/'

          echo "--- verifying no remaining Homebrew paths ---"
          for bin in python-sidecar/bin/ffmpeg python-sidecar/bin/ffprobe; do
            if otool -L "$bin" | grep -qE "/usr/local|/opt/homebrew|Cellar"; then
              echo "✗ $bin still references Homebrew paths after bundling" >&2
              otool -L "$bin" >&2
              exit 1
            fi
          done

          echo "--- confirming drawtext filter is present ---"
          python-sidecar/bin/ffmpeg -filters 2>/dev/null | grep -q drawtext \
            || { echo "✗ drawtext filter missing from bundled ffmpeg" >&2; exit 1; }

          echo "--- confirming both binaries actually RUN (not just link-check) ---"
          for bin in python-sidecar/bin/ffmpeg python-sidecar/bin/ffprobe; do
            out="$(DYLD_PRINT_LIBRARIES=0 "$bin" -version 2>&1)" || {
              echo "✗ $bin failed to execute after bundling — this is the exact class of bug that shipped broken in 2.3.23" >&2
              echo "$out" >&2
              otool -L "$bin" >&2
              exit 1
            }
            echo "$out" | grep -qi "symbol not found\|library not loaded\|dyld\[" && {
              echo "✗ $bin printed a dyld error despite exit 0 — treating as failure" >&2
              echo "$out" >&2
              exit 1
            }
            echo "✓ $bin -version ran cleanly"
          done

          file python-sidecar/bin/ffmpeg
          ls -lah python-sidecar/bin/
          echo "bundled $(ls python-sidecar/bin/lib | wc -l | tr -d ' ') dylibs into python-sidecar/bin/lib/"

      - name: fetch faster-whisper-tiny model
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          import shutil, os
          dest = "python-sidecar/models/faster-whisper-tiny"
          os.makedirs(dest, exist_ok=True)
          src = snapshot_download(
              repo_id="Systran/faster-whisper-tiny",
              allow_patterns=["config.json", "model.bin", "tokenizer.json", "vocabulary.txt"],
          )
          for fname in ("config.json", "model.bin", "tokenizer.json", "vocabulary.txt"):
              shutil.copy(os.path.join(src, fname), os.path.join(dest, fname))
          PY
          ls -lah python-sidecar/models/faster-whisper-tiny/

      # 2026-07-15 · P0 clipping-hang fix ·
      # `08_receipts/p0-clipping-hang-root-cause/INVESTIGATION.md`.
      #
      # Every signed release since 2.2.31 (~2 weeks) shipped without
      # `dist/sidecar-bundle/liquid-clips-sidecar` — the PyInstaller
      # binary the Rust shell (see src-tauri/src/sidecar.rs::find_sidecar_binding)
      # hard-requires as its ONLY production sidecar. Result: silent
      # PENDING clipping journey, empty-transcript modal, zero clips.
      #
      # This step runs the existing python-sidecar/build_sidecar.sh to
      # produce the --onedir PyInstaller bundle before the Tauri build
      # copies it into the .app via bundle.resources. The script is
      # arch-aware · matches the runner's native arch to avoid a
      # cross-build (ctranslate2 wheels are arch-specific).
      #
      # Python 3.12 is pinned because Python 3.14 (macos-15-intel default)
      # ships a Cython that fails to compile `av` (PyAV audio backend,
      # required by faster-whisper). 3.12 has pre-built av wheels for
      # both arm64 and x86_64 macOS.
      #
      # The build_sidecar.sh script expects deps in a `.venv` inside
      # python-sidecar/ (see script guard at line 82). Bootstrap that
      # venv here from the authoritative requirements.txt plus
      # PyInstaller (build-only tool, not in runtime requirements).
      #
      # `mlx-whisper` + `mlx` are already conditionally listed in
      # requirements.txt via a `sys_platform + platform_machine` marker,
      # so pip auto-picks them on the aarch64 runner only.
      - name: setup Python 3.12 for sidecar build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build PyInstaller sidecar bundle
        run: |
          set -euo pipefail
          cd python-sidecar
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller
          cd ..
          bash python-sidecar/build_sidecar.sh --arch ${{ matrix.target.arch }}
          # Fail hard if the binary isn't produced — this is the P0
          # gate that never existed before 2026-07-15. Any missing
          # binary here means every install would silent-PEND on clip.
          test -x python-sidecar/dist/sidecar-bundle/liquid-clips-sidecar \
            || { echo "✗ PyInstaller bundle missing after build_sidecar.sh"; exit 1; }
          echo "✓ sidecar bundle produced:"
          ls -lah python-sidecar/dist/sidecar-bundle/liquid-clips-sidecar
          du -sh python-sidecar/dist/sidecar-bundle/

      # 2026-08-15 · P0 fix, part 2 — opencv-python (cv2) ships its OWN
      # bundled copy of FFmpeg's shared libraries inside its wheel.
      # PyInstaller's dependency walker discovers `cv2`'s import and
      # independently auto-collects THOSE dylibs, flattening them into
      # _internal/ (top level) — a different actual build than the
      # dylibbundler-bundled ffmpeg-full copy this workflow deliberately
      # fetched, despite an IDENTICAL filename (e.g.
      # libavfilter.11.14.102.dylib). Whichever one PyInstaller collects
      # last wins the name collision; confirmed live it was cv2's, and
      # that one is missing a symbol ffprobe needs — crashes on every
      # single invocation. This is exactly why the "fetch ffmpeg +
      # ffprobe" step's own runtime check upstream (added earlier in
      # this same fix pass) still went green: it tests the correct
      # PRE-PyInstaller copy in python-sidecar/bin/, but the collision
      # only happens DURING this PyInstaller step, in the copy that
      # actually ships. Force every ffmpeg-family dylib in the shipped
      # bundle back to our known-good dylibbundler copy, then verify the
      # REAL shipped binary — not the pre-bundle one — actually runs.
      - name: force-resolve ffmpeg dylib collisions from PyInstaller auto-collection
        run: |
          set -euo pipefail
          INTERNAL="python-sidecar/dist/sidecar-bundle/_internal"
          KNOWN_GOOD="python-sidecar/bin/lib"
          fixed=0
          for good in "$KNOWN_GOOD"/*.dylib; do
            [ -f "$good" ] || continue
            name="$(basename "$good")"
            collided="$INTERNAL/$name"
            if [ -f "$collided" ]; then
              if ! cmp -s "$good" "$collided"; then
                echo "✗ collision: $name differs between our ffmpeg-full bundle and PyInstaller's auto-collected copy — overwriting with the known-good one"
                cp -f "$good" "$collided"
                fixed=$((fixed + 1))
              fi
            fi
          done
          echo "resolved $fixed colliding dylib(s)"

          # 2026-08-17 · P0 fix — the same collision class as the dylibs
          # above, but for the ffmpeg/ffprobe EXECUTABLES themselves.
          # PyInstaller's --add-data verbatim-copies python-sidecar/bin/
          # into _internal/bin/ at build time, so the two should always be
          # byte-identical — but confirmed live on a shipped build
          # (v2.3.29): _internal/bin/ffmpeg differed from bin/ffmpeg
          # (different content hash despite an identical `-version`
          # string) and crashed deterministically on AV1+Opus sources with
          # "Assertion fffilter(ctx->filter)->activate == activate failed
          # at libavfilter/buffersink.c:336" — while bin/ffmpeg handled
          # the exact same file with no issue. Root cause of the
          # divergence wasn't pinned down (stale artifact reuse between
          # runs is the leading theory — dylibbundler-refreshed bin/ vs an
          # older _internal/ carried over), so rather than chase that,
          # force parity the same way the dylib loop above does: the
          # dylibbundler-processed copy in bin/ is the one this workflow
          # verified moments ago, so it's the known-good source of truth.
          for exe in ffmpeg ffprobe; do
            good="python-sidecar/bin/$exe"
            collided="$INTERNAL/bin/$exe"
            if [ -f "$good" ] && [ -f "$collided" ] && ! cmp -s "$good" "$collided"; then
              echo "✗ collision: $exe differs between python-sidecar/bin/ and PyInstaller's auto-collected _internal/bin/ — overwriting with the known-good one"
              cp -f "$good" "$collided"
              chmod +x "$collided"
            fi
          done

          # 2026-08-15 · P0 sidecar-boot fix. Reported live: `import ssl`
          # crashed sidecar startup on every launch with "Library not
          # loaded: @executable_path/lib/libcrypto.3.dylib, referenced
          # from _internal/libssl.3.dylib" — total clip-engine outage.
          # dylibbundler stamped libssl.3.dylib's own id AND its
          # libcrypto dependency as @executable_path/lib/NAME.dylib,
          # which only resolves correctly when the loading executable is
          # bin/ffmpeg or bin/ffprobe (next to their own bin/lib/) — not
          # when Python's _ssl module loads this flat PyInstaller-
          # collected copy, where @executable_path resolves against the
          # main sidecar binary (sidecar-bundle/), which has no lib/ dir.
          #
          # First two attempts here tried blanket-rewriting this same
          # broken convention across ALL ~100 ffmpeg-family dylibs
          # PyInstaller also auto-collects flat into _internal/ (most of
          # which are NOT on the crash path at all) and broke ffmpeg
          # itself as a result: ffmpeg's LC_RPATH is @loader_path/.. (one
          # level up from bin/ffmpeg, i.e. flat _internal/), so its top-
          # level codec libs (libavformat etc.) load from there via
          # @rpath — but SOME of those flat codec dylibs' OWN sibling
          # refs (e.g. libvorbis -> libogg) were ALREADY correctly
          # resolving through @executable_path/lib/ (ffmpeg's own
          # @executable_path IS bin/, so .../lib/ correctly hits
          # bin/lib/) — rewriting those to @loader_path/ pointed them at
          # the flat _internal/ copies instead, which is a different
          # (and apparently not fully consistent) file set, and
          # `ffmpeg -version` started failing with "Library not loaded"
          # for dylibs the blanket rewrite touched but didn't need to.
          #
          # Scoped down to exactly the proven crash path: only
          # libssl.3.dylib's own id and its libcrypto dependency. Every
          # other dylib's existing (if inconsistent-looking)
          # @executable_path/lib/ convention is left untouched because
          # ffmpeg/ffprobe have shipped working with it since 2.3.23.
          #
          # otool -L line 1 is the FILE PATH being inspected (ends in
          # ':'), not a Mach-O reference — line 2 is the dylib's OWN
          # install name/id, line 3+ are its real dependencies.
          SSL="$INTERNAL/libssl.3.dylib"
          if [ -f "$SSL" ]; then
            own_id="$(otool -L "$SSL" | awk 'NR==2{print $1}')"
            if [[ "$own_id" == @executable_path/lib/* ]]; then
              install_name_tool -id "@loader_path/libssl.3.dylib" "$SSL"
              echo "✓ rewrote libssl.3.dylib's own id: $own_id -> @loader_path/libssl.3.dylib"
            fi
            refs="$(otool -L "$SSL" | awk 'NR>2{print $1}' | grep '^@executable_path/lib/' || true)"
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              dep_name="$(basename "$ref")"
              install_name_tool -change "$ref" "@loader_path/$dep_name" "$SSL"
              echo "✓ rewrote libssl.3.dylib's dependency: $ref -> @loader_path/$dep_name"
            done <<< "$refs"
          else
            echo "(skip) $SSL not present in this bundle"
          fi

          echo "--- verifying libssl.3.dylib carries no remaining @executable_path/lib/ references ---"
          if [ -f "$SSL" ] && otool -L "$SSL" | grep -q '@executable_path/lib/'; then
            echo "✗ libssl.3.dylib still references @executable_path/lib/ after rewrite" >&2
            otool -L "$SSL" >&2
            exit 1
          fi
          echo "✓ libssl.3.dylib clean"

          echo "--- dlopen-verifying the exact chain that crashed sidecar boot (libssl -> libcrypto) ---"
          python3 -c "import ctypes; ctypes.CDLL('$INTERNAL/libssl.3.dylib'); print('dlopen ok: libssl.3.dylib resolved its libcrypto sibling via @loader_path')" || {
            echo "✗ dlopen($INTERNAL/libssl.3.dylib) failed — the @loader_path rewrite did not fix the sidecar-boot crash" >&2
            otool -L "$INTERNAL/libssl.3.dylib" >&2
            exit 1
          }

          echo "--- verifying the ACTUAL shipped binaries (not the pre-bundle copies) actually run ---"
          for bin in "$INTERNAL/bin/ffmpeg" "$INTERNAL/bin/ffprobe"; do
            [ -x "$bin" ] || { echo "✗ $bin missing or not executable" >&2; exit 1; }
            out="$("$bin" -version 2>&1)" || {
              echo "✗ $bin failed to execute — the exact class of bug that shipped broken in 2.3.23, now caught at the correct location" >&2
              echo "$out" >&2
              otool -L "$bin" >&2
              exit 1
            }
            echo "$out" | grep -qi "symbol not found\|library not loaded\|dyld\[" && {
              echo "✗ $bin printed a dyld error despite exit 0 — treating as failure" >&2
              echo "$out" >&2
              exit 1
            }
            echo "✓ $bin -version ran cleanly (shipped path)"
          done

      # 2026-08-21 · P0 fix — total transcription outage. Reported live on
      # a fresh 2.3.38 install: every ingest died at the "transcribe" stage
      # with `import av` raising a multi-line ImportError chain (libavdevice
      # -> libavfilter -> libavformat -> libavcodec -> libswscale ->
      # libswresample -> libavutil -> libX11, all "Library not loaded").
      #
      # Root cause is the SAME class of bug as the libssl.3.dylib fix above
      # (`@executable_path/lib/NAME.dylib` resolving against sidecar-bundle/,
      # which has no lib/ dir) — but this time the affected dylib
      # (_internal/libavdevice.62.3.102.dylib, the flat copy @loader_path/..
      # from av/_core.abi3.so's own rpath resolves to) has ~80 of its own
      # sibling references using that broken convention, not just one or
      # two. Rewriting all ~80 with install_name_tool would be exactly the
      # blanket rewrite the comment above already documents breaking ffmpeg
      # itself once before — too much surface area to do safely per-file.
      #
      # Instead of rewriting any embedded path, satisfy what's already
      # being asked for: create the sidecar-bundle/lib/ directory literally
      # every one of those @executable_path/lib/ references is looking for,
      # populated with the same known-good dylibbundler copies already
      # trusted elsewhere in this workflow. Verified locally against the
      # exact broken chain before writing this: with lib/ absent, a native
      # dlopen of av/_core.abi3.so reproduces the identical multi-line
      # "Library not loaded" chain from the live crash report; with lib/
      # populated, that entire chain resolves — the only remaining error is
      # `symbol not found: _PyBytes_Type`, which is expected (a bare C dlopen
      # probe isn't a Python interpreter and doesn't provide CPython's C API
      # symbols) and unrelated to this bug.
      - name: create sidecar-bundle/lib for @executable_path/lib/ resolution
        run: |
          set -euo pipefail
          BUNDLE="python-sidecar/dist/sidecar-bundle"
          KNOWN_GOOD="python-sidecar/bin/lib"
          mkdir -p "$BUNDLE/lib"
          cp "$KNOWN_GOOD"/*.dylib "$BUNDLE/lib/"
          echo "✓ populated $BUNDLE/lib with $(ls "$BUNDLE/lib" | wc -l | tr -d ' ') known-good dylibs"

          echo "--- dlopen-verifying the exact chain that crashed transcription (av/_core.abi3.so) ---"
          cat > /tmp/dlopen_probe.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            void *h = dlopen(argv[1], RTLD_NOW);
            if (!h) { fprintf(stderr, "DLOPEN FAILED: %s\n", dlerror()); return 1; }
            printf("DLOPEN OK\n");
            return 0;
          }
          EOF
          clang -o "$BUNDLE/dlopen_probe" /tmp/dlopen_probe.c
          out="$("$BUNDLE/dlopen_probe" "$BUNDLE/_internal/av/_core.abi3.so" 2>&1)" || true
          rm -f "$BUNDLE/dlopen_probe"
          echo "$out"
          if echo "$out" | grep -q "Library not loaded\|no such file"; then
            echo "✗ av/_core.abi3.so still can't resolve its ffmpeg dylibs after populating lib/" >&2
            exit 1
          fi
          echo "✓ av/_core.abi3.so's dylib chain resolves (remaining symbol-lookup output, if any, is expected from a non-Python probe)"

      # xattr strip: prevents codesign "resource fork" failure on bundled
      # files that carry macOS quarantine/Finder metadata. desktop-2 now
      # ships python-sidecar/ so strip targets include it.
      - name: strip extended attributes from bundled files
        run: |
          set -euo pipefail
          xattr -cr python-sidecar/bin/
          xattr -cr python-sidecar/models/
          xattr -cr python-sidecar/*.py 2>/dev/null || true
          xattr -cr python-sidecar/dist/ 2>/dev/null || true
          xattr -cr desktop-2/src/ 2>/dev/null || true
          xattr -cr desktop-2/public/ 2>/dev/null || true
          xattr -cr desktop-2/src-tauri/icons/
          xattr -cr desktop-2/src-tauri/entitlements*
          xattr -cr desktop-2/src-tauri/target/release/ 2>/dev/null || true
          echo "✓ xattrs stripped"

      - name: import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # apple-actions/import-codesign-certs creates signing_temp.keychain but
      # doesn't always add it to codesign's search list. Force the keychain
      # to the front of the user search list and dump identities so we can
      # confirm what's loaded.
      - name: register codesign keychain + verify identity
        run: |
          set -euo pipefail
          security list-keychains -d user -s signing_temp.keychain login.keychain
          security default-keychain -d user -s signing_temp.keychain || true
          security set-keychain-settings -lut 21600 signing_temp.keychain
          echo "--- identities visible to codesign ---"
          security find-identity -v -p codesigning
          echo "--- Developer ID identities ---"
          security find-identity -v -p codesigning | grep -i "Developer ID" || echo "(no Developer ID match)"

      # Ported from legacy release.yml (which shipped v0.7.55 successfully).
      # The brew-fetched ffmpeg/ffprobe + tracked junior-face-detect helper
      # binaries must be Developer-ID signed + hardened-runtime-enabled +
      # secure-timestamped BEFORE the Tauri build copies them into the .app
      # bundle. Without this, notarisation rejects every Mac upload with
      # "The binary is not signed" + "The signature does not include a
      # secure timestamp" + "The executable does not have the hardened
      # runtime enabled." Reference: ship 2.2.4 (run 28406073070) failure.
      - name: sign sidecar helper binaries
        run: |
          set -euo pipefail
          IDENTITY='Developer ID Application: daniel diyepriye dokubo (KT68NGT4LX)'
          codesign_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if codesign "$@"; then
                return 0
              fi
              echo "codesign failed on attempt $attempt; retrying after timestamp service backoff..." >&2
              sleep $((attempt * 10))
            done
            codesign "$@"
          }
          # 2026-07-16 · P0 notarize fix (v3 · local-repro proven).
          # PyInstaller's Python.framework is structurally correct on the
          # source bundle: proper Info.plist at Versions/<ver>/Resources
          # with CFBundlePackageType=FMWK · four framework symlinks intact.
          # Prior speculation about missing Info.plist and needing explicit
          # `--identifier` flags was operating on false premises. Local
          # inspection proves the source framework signs cleanly with just
          # the standard leaf-first order + Developer ID identity.
          sign_python_framework() {
            local FW="$1"
            if [ ! -d "$FW" ]; then
              echo "(skip) framework not found: $FW"
              return 0
            fi
            local CURRENT_LINK="$FW/Versions/Current"
            local CURRENT_VER
            if [ -L "$CURRENT_LINK" ]; then
              CURRENT_VER=$(readlink "$CURRENT_LINK")
            elif [ -d "$CURRENT_LINK" ]; then
              CURRENT_VER=$(basename "$(cd "$CURRENT_LINK" && pwd -P)")
            else
              CURRENT_VER=$(find "$FW/Versions" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | head -1)
            fi
            local VER_DIR="$FW/Versions/$CURRENT_VER"
            local INNER_BIN="$VER_DIR/Python"
            if [ ! -f "$INNER_BIN" ]; then
              echo "(warn) framework $FW · no inner Python binary at $INNER_BIN" >&2
              return 0
            fi
            echo "Signing framework leaf: $INNER_BIN"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$INNER_BIN"
            codesign --verify --strict --verbose=2 "$INNER_BIN"
            echo "Signing framework version dir: $VER_DIR"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$VER_DIR"
            echo "Signing framework wrapper: $FW"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$FW"
            codesign --verify --strict --verbose=2 "$FW"
          }
          for bin in \
            python-sidecar/bin/ffmpeg \
            python-sidecar/bin/ffprobe \
            python-sidecar/bin/junior-face-detect
          do
            if [ ! -f "$bin" ]; then
              echo "(skip) missing optional sidecar binary: $bin"
              continue
            fi
            echo "Signing $bin"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          # 2026-08-07 · dylibbundler-bundled ffmpeg/ffprobe dependencies
          # (python-sidecar/bin/lib/*.dylib, ~100 files). install_name_tool
          # invalidates any existing signature when it rewrites load
          # commands, so these need a real Developer ID signature just like
          # the binaries above — an unsigned or ad-hoc-signed dylib fails
          # the pre-notary audit later in this workflow.
          if [ -d python-sidecar/bin/lib ]; then
            lib_count=0
            for dylib in python-sidecar/bin/lib/*.dylib; do
              [ -f "$dylib" ] || continue
              codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$dylib"
              codesign --verify --strict --verbose=2 "$dylib"
              lib_count=$((lib_count + 1))
            done
            echo "✓ signed $lib_count bundled ffmpeg dylibs"
          fi
          # 2026-07-15 · P0 clipping-hang fix · sign every Mach-O inside the
          # PyInstaller --onedir bundle. Notarisation rejects the .app if
          # any bundled dylib / executable is unsigned or timestamped
          # without secure-timestamp. Order matters: leaf-first (framework
          # inner binary → framework wrapper → standalone _internal/Python
          # → walk of other Mach-O → outer liquid-clips-sidecar entrypoint).
          BUNDLE=python-sidecar/dist/sidecar-bundle
          if [ ! -x "$BUNDLE/liquid-clips-sidecar" ]; then
            echo "✗ PyInstaller sidecar bundle missing at $BUNDLE/liquid-clips-sidecar" >&2
            exit 1
          fi
          # a) Python.framework — sign the symlink chain from leaf up.
          sign_python_framework "$BUNDLE/_internal/Python.framework"
          # b) Standalone _internal/Python — PyInstaller ships one alongside
          #    the framework. Ensure it's executable then sign.
          if [ -f "$BUNDLE/_internal/Python" ]; then
            chmod +x "$BUNDLE/_internal/Python" || true
            echo "Signing standalone: $BUNDLE/_internal/Python"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$BUNDLE/_internal/Python"
            codesign --verify --strict --verbose=2 "$BUNDLE/_internal/Python"
          fi
          # c) Walk _internal/ for every Mach-O (dylibs + .so + secondary
          #    executables). `-type f` skips symlinks so the framework
          #    symlink chain isn't double-signed here. `codesign -dv` on
          #    a non-Mach-O returns non-zero and gets skipped.
          find "$BUNDLE/_internal" -type f \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do
                # Skip framework binaries · handled leaf-first above.
                case "$f" in
                  *"/Python.framework/"*) continue ;;
                  "$BUNDLE/_internal/Python") continue ;;
                esac
                if codesign -dv "$f" >/dev/null 2>&1 || file "$f" | grep -q "Mach-O"; then
                  codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$f" 2>&1 | tail -1 || true
                fi
              done
          # d) Outer entrypoint · sign LAST so its embedded metadata reflects
          #    all interior signatures. Rust shell spawns this binary.
          echo "Signing $BUNDLE/liquid-clips-sidecar (entrypoint)"
          codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$BUNDLE/liquid-clips-sidecar"
          codesign --verify --strict --verbose=2 "$BUNDLE/liquid-clips-sidecar"
          echo "✓ PyInstaller bundle Mach-O files signed"
          echo ""
          echo "--- signing authority for critical Python binaries (pre-build) ---"
          for p in "$BUNDLE/_internal/Python" "$BUNDLE/_internal/Python.framework/Python"; do
            if [ -e "$p" ]; then
              echo "PATH: $p"
              codesign -dvv "$p" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier|Signature|Timestamp" || true
              echo ""
            else
              echo "(missing) $p"
            fi
          done
          echo "✓ sidecar binaries signed"

      # 2026-07-08 · v2.2.33 shipped without VITE_CLERK_PUBLISHABLE_KEY
      # baked into the Vite bundle → ClerkProvider mounted with "" and
      # crashed on Intel boot. v2.2.35 · replaced the inline check with
      # desktop-2/scripts/assert-env.mjs so local `tauri build` and CI
      # enforce the SAME contract from a single source
      # (desktop-2/required-env.json). Fails fast · never echoes any
      # value.
      - name: assert required VITE_* env vars (build-time contract)
        working-directory: ./desktop-2
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BACKEND_URL: https://api.jnremployee.com
          # 2026-08-05 · Crew Scanner's Google Connect was silently dead in
          # every shipped build — required-env.json didn't gate on it, so
          # the build succeeded with an empty client id and runOAuth()
          # just returned MISCONFIGURED at runtime. redirect_uri must
          # match junior-backend's google_redirect_uri exactly (see
          # app/config.py) or Google rejects the token exchange even with
          # a valid client id.
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: https://api.jnremployee.com/auth/google/callback
        run: node scripts/assert-env.mjs

      # iCloud codesign path guard (v2.2.35 P3). GitHub-hosted runners
      # never land under iCloud, so this is a paranoia belt for the very
      # rare case someone re-runs the workflow on a self-hosted mac
      # runner. Refuse before touching a single file.
      - name: iCloud path guard
        run: |
          case "$PWD" in
            *"Mobile Documents"*|*"CloudDocs"*)
              echo "ERROR: build path is under iCloud File Provider — codesign will fail" >&2
              exit 1
              ;;
          esac

      - name: build signed macOS app
        working-directory: ./desktop-2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 2026-07-08 · Vite bakes VITE_* env at build time. Without
          # this, the shipped bundle has publishable key = "" and
          # ClerkProvider crashes on mount. Public Clerk publishable
          # key only · never inject CLERK_SECRET_KEY into a client
          # bundle. VITE_BACKEND_URL forces the shipped app to hit
          # our prod backend rather than the dev fallback.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BACKEND_URL: https://api.jnremployee.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # 2026-08-05 · see the assert-env step above for why both of
          # these are required for Crew Scanner's Google Connect to work
          # in a real shipped build.
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: https://api.jnremployee.com/auth/google/callback
        # Per-arch native build. Each matrix runner builds its own slice.
        # We do not lipo a universal binary — instead we publish two DMGs.
        run: npm run tauri -- build --target ${{ matrix.target.rust_target }} --bundles app

      - name: repair-sign macOS app bundle
        run: |
          set -euo pipefail
          APP=$(find desktop-2/src-tauri/target -path '*/bundle/macos/Liquid Clips.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "✗ No Liquid Clips.app bundle found" >&2
            exit 1
          fi
          desktop-2/scripts/sign-clean-macos-app.sh "$APP"

      # 2026-07-16 · P0 notarize fix (v3 · local-repro proven).
      # Root cause locally reproduced: Tauri's bundle.resources copy
      # DEREFERENCES symlinks. Python.framework/Versions/Current, top-level
      # Python + Resources symlinks, plus _internal/Python and every
      # versioned dylib symlink become real files/dirs after Tauri writes
      # the app. That turns Python.framework into a shape that codesign
      # sees as BOTH app-like (real Python at wrapper root) AND framework-
      # like (Versions/) → "bundle format is ambiguous".
      #
      # Fix (three parts, all inside this step, all idempotent):
      #   1. Restore the four dereferenced symlinks the framework needs.
      #   2. Walk every embedded Mach-O in _internal/ and re-sign with the
      #      outer Developer ID so `dlopen` doesn't fail at runtime with
      #      "different Team IDs" (--deep --force in sign-clean-macos-app.sh
      #      does not reliably re-sign every .dylib/.so).
      #   3. Leaf-first sign framework, sidecar entrypoint, re-seal outer app.
      #
      # See 08_receipts/p0-framework-signing-local-repro/ for the local
      # reproduction transcript proving each step is required.
      - name: resign sidecar Python binaries inside app bundle
        run: |
          set -euo pipefail
          IDENTITY='Developer ID Application: daniel diyepriye dokubo (KT68NGT4LX)'
          codesign_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if codesign "$@"; then
                return 0
              fi
              echo "codesign failed on attempt $attempt; retrying after timestamp service backoff..." >&2
              sleep $((attempt * 10))
            done
            codesign "$@"
          }
          APP=$(find desktop-2/src-tauri/target -path '*/bundle/macos/Liquid Clips.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "✗ No Liquid Clips.app bundle found for in-app resign" >&2
            exit 1
          fi
          IN_APP_BUNDLE_CANDIDATES=(
            "$APP/Contents/Resources/_up_/_up_/python-sidecar/dist/sidecar-bundle"
            "$APP/Contents/Resources/_up_/python-sidecar/dist/sidecar-bundle"
            "$APP/Contents/Resources/python-sidecar/dist/sidecar-bundle"
          )
          IN_APP_BUNDLE=""
          for c in "${IN_APP_BUNDLE_CANDIDATES[@]}"; do
            if [ -d "$c" ]; then
              IN_APP_BUNDLE="$c"
              break
            fi
          done
          if [ -z "$IN_APP_BUNDLE" ]; then
            echo "✗ Cannot locate sidecar-bundle inside app · candidates:" >&2
            for c in "${IN_APP_BUNDLE_CANDIDATES[@]}"; do echo "  $c" >&2; done
            echo "--- app Resources tree (first 40 entries) ---" >&2
            find "$APP/Contents/Resources" -maxdepth 5 -type d 2>&1 | head -40 >&2
            exit 1
          fi
          echo "Found in-app sidecar bundle: $IN_APP_BUNDLE"
          FW="$IN_APP_BUNDLE/_internal/Python.framework"
          # -------- Part 1 · restore the four dereferenced symlinks -------
          # Framework's Versions/Current → <ver> (whichever real version dir exists)
          if [ -d "$FW/Versions" ] && [ ! -L "$FW/Versions/Current" ]; then
            REAL_VER=$(find "$FW/Versions" -mindepth 1 -maxdepth 1 -type d ! -name Current -exec basename {} \; | head -1)
            if [ -n "$REAL_VER" ]; then
              rm -rf "$FW/Versions/Current"
              (cd "$FW/Versions" && ln -sf "$REAL_VER" "Current")
              echo "Restored: Python.framework/Versions/Current → $REAL_VER"
            fi
          fi
          # Framework's top-level Python → Versions/Current/Python
          if [ -e "$FW/Python" ] && [ ! -L "$FW/Python" ]; then
            rm -f "$FW/Python"
            (cd "$FW" && ln -sf "Versions/Current/Python" "Python")
            echo "Restored: Python.framework/Python → Versions/Current/Python"
          fi
          # Framework's top-level Resources → Versions/Current/Resources
          if [ -e "$FW/Resources" ] && [ ! -L "$FW/Resources" ]; then
            rm -rf "$FW/Resources"
            (cd "$FW" && ln -sf "Versions/Current/Resources" "Resources")
            echo "Restored: Python.framework/Resources → Versions/Current/Resources"
          fi
          # _internal/Python → Python.framework/Versions/<ver>/Python
          if [ -e "$IN_APP_BUNDLE/_internal/Python" ] && [ ! -L "$IN_APP_BUNDLE/_internal/Python" ]; then
            REAL_VER=$(readlink "$FW/Versions/Current" 2>/dev/null || echo "3.12")
            rm -f "$IN_APP_BUNDLE/_internal/Python"
            (cd "$IN_APP_BUNDLE/_internal" && ln -sf "Python.framework/Versions/${REAL_VER}/Python" "Python")
            echo "Restored: _internal/Python → Python.framework/Versions/${REAL_VER}/Python"
          fi
          # -------- Part 2 · walk every embedded Mach-O in _internal ------
          # Sign with the OUTER Developer ID so runtime dlopen doesn't hit
          # Team ID mismatches. Skip framework paths (handled in Part 3) and
          # _internal/Python (now a symlink into the framework · signing it
          # would double-sign the framework leaf).
          echo "Walking _internal/ Mach-O files (this signs ~200 dylibs + .so)"
          walk_count=0
          while IFS= read -r f; do
            case "$f" in
              *"/Python.framework/"*) continue ;;
              "$IN_APP_BUNDLE/_internal/Python") continue ;;
            esac
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$f" >/dev/null 2>&1 || true
              walk_count=$((walk_count + 1))
            fi
          done < <(find "$IN_APP_BUNDLE/_internal" -type f \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) 2>/dev/null)
          echo "Signed $walk_count Mach-O files in _internal/"
          # -------- Part 3 · leaf-first framework sign · sidecar · reseal --
          REAL_VER=$(readlink "$FW/Versions/Current" 2>/dev/null || echo "3.12")
          INNER_BIN="$FW/Versions/${REAL_VER}/Python"
          if [ -f "$INNER_BIN" ]; then
            echo "Signing framework leaf: $INNER_BIN"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$INNER_BIN"
            codesign --verify --strict --verbose=2 "$INNER_BIN"
            echo "Signing framework version dir: $FW/Versions/${REAL_VER}"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$FW/Versions/${REAL_VER}"
            echo "Signing framework wrapper: $FW"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$FW"
            codesign --verify --strict --verbose=2 "$FW"
          fi
          if [ -x "$IN_APP_BUNDLE/liquid-clips-sidecar" ]; then
            echo "Signing sidecar entrypoint: $IN_APP_BUNDLE/liquid-clips-sidecar"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$IN_APP_BUNDLE/liquid-clips-sidecar"
            codesign --verify --strict --verbose=2 "$IN_APP_BUNDLE/liquid-clips-sidecar"
          fi
          ENTITLEMENTS="$(cd desktop-2/src-tauri && pwd)/entitlements-direct.plist"
          echo "Re-sealing app bundle: $APP"
          codesign_with_retry --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          echo ""
          echo "--- signing authority for critical in-app Python binaries ---"
          for p in "$IN_APP_BUNDLE/_internal/Python" "$IN_APP_BUNDLE/_internal/Python.framework/Python" "$FW"; do
            if [ -e "$p" ]; then
              echo "PATH: $p"
              codesign -dvv "$p" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier|Signature|Timestamp" || true
              echo ""
            else
              echo "(missing) $p"
            fi
          done
          echo "✓ In-app sidecar Python binaries resigned + app resealed"

      - name: rebuild DMG + updater tarball from repaired app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP=$(find desktop-2/src-tauri/target -path '*/bundle/macos/Liquid Clips.app' -type d | head -1)
          # Delete the stale tauri-default DMG (with space, unsigned container)
          # before rebuild so notarize.sh + upload glob only see the slugged
          # + re-signed DMG. Inherited fix from legacy v0.7.50 incident where
          # `find | head -1` picked the unsigned tauri DMG and uploaded a
          # non-notarised file.
          find desktop-2/src-tauri/target -path '*/bundle/dmg/*.dmg' -type f -delete || true
          desktop-2/scripts/package-signed-macos-artifacts.sh "$APP" ${{ matrix.target.slug }}

      # 2026-07-15 · P0 notarize fix · pre-notary Mach-O audit. Fails CI
      # BEFORE the 5-minute notary round-trip if any bundled Mach-O is:
      #   - unsigned (no CodeDirectory)
      #   - ad-hoc signed (no Team Identifier)
      #   - signed by the wrong authority (not Developer ID Application)
      #   - invalid under `codesign --verify --strict --verbose=4`
      # Walks the app bundle recursively. Symlinks are followed only via
      # codesign's own path resolution. Reports every offender before
      # exiting non-zero so the CI log shows the full failure surface.
      - name: pre-notary Mach-O audit
        run: |
          set -euo pipefail
          IDENTITY_AUTHORITY='Developer ID Application: daniel diyepriye dokubo (KT68NGT4LX)'
          APP=$(find desktop-2/src-tauri/target -path '*/bundle/macos/Liquid Clips.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "✗ Cannot locate Liquid Clips.app for audit" >&2
            exit 1
          fi
          echo "Auditing every Mach-O under $APP"
          FAIL=0
          FAIL_LIST=""
          # `-type f` skips symlinks so we audit real file locations only.
          # For each file: `file` tells us Mach-O vs data, `codesign -dvv`
          # reveals authority + signature state.
          while IFS= read -r -d '' f; do
            if ! file "$f" | grep -q "Mach-O"; then
              continue
            fi
            DVV=$(codesign -dvv "$f" 2>&1 || true)
            if echo "$DVV" | grep -q "code object is not signed"; then
              echo "✗ UNSIGNED: $f" >&2
              FAIL=1
              FAIL_LIST="$FAIL_LIST\n  UNSIGNED: $f"
              continue
            fi
            if echo "$DVV" | grep -qi "Signature=adhoc"; then
              echo "✗ AD-HOC SIGNED: $f" >&2
              FAIL=1
              FAIL_LIST="$FAIL_LIST\n  AD-HOC: $f"
              continue
            fi
            AUTH=$(echo "$DVV" | grep "^Authority=" | head -1 || true)
            if [ -z "$AUTH" ]; then
              echo "✗ NO AUTHORITY LINE: $f" >&2
              echo "  dvv output:" >&2
              echo "$DVV" | sed 's/^/    /' >&2
              FAIL=1
              FAIL_LIST="$FAIL_LIST\n  NO-AUTHORITY: $f"
              continue
            fi
            if ! echo "$AUTH" | grep -qF "$IDENTITY_AUTHORITY"; then
              echo "✗ WRONG AUTHORITY on $f: $AUTH" >&2
              FAIL=1
              FAIL_LIST="$FAIL_LIST\n  WRONG-AUTHORITY: $f"
              continue
            fi
            if ! codesign --verify --strict --verbose=4 "$f" >/dev/null 2>&1; then
              VOUT=$(codesign --verify --strict --verbose=4 "$f" 2>&1 || true)
              echo "✗ STRICT VERIFY FAILED on $f" >&2
              echo "$VOUT" | sed 's/^/    /' >&2
              FAIL=1
              FAIL_LIST="$FAIL_LIST\n  STRICT-VERIFY: $f"
              continue
            fi
          done < <(find "$APP" -type f -print0)
          # Also verify the outer app bundle passes deep+strict once more —
          # notary applies these checks to the enclosing bundle too.
          if ! codesign --verify --deep --strict --verbose=4 "$APP" >/dev/null 2>&1; then
            VOUT=$(codesign --verify --deep --strict --verbose=4 "$APP" 2>&1 || true)
            echo "✗ OUTER APP STRICT VERIFY FAILED: $APP" >&2
            echo "$VOUT" | sed 's/^/    /' >&2
            FAIL=1
            FAIL_LIST="$FAIL_LIST\n  APP-STRICT: $APP"
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "" >&2
            echo "✗ Pre-notary audit failed · offenders:" >&2
            printf "$FAIL_LIST\n" >&2
            echo "" >&2
            echo "Aborting BEFORE the 5-minute notary round-trip." >&2
            exit 1
          fi
          echo "✓ Pre-notary audit passed · every Mach-O signed by $IDENTITY_AUTHORITY"

      - name: notarize and staple .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(find desktop-2/src-tauri/target -path '*/bundle/dmg/Liquid.Clips_*.dmg' -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "✗ No rebuilt .dmg found at bundle/dmg/Liquid.Clips_*.dmg" >&2
            exit 1
          fi
          echo "→ notarising $DMG"
          desktop-2/scripts/notarize.sh "$DMG"

      - name: verify notarized installer
        run: |
          set -euo pipefail
          DMG=$(find desktop-2/src-tauri/target -path '*/bundle/dmg/Liquid.Clips_*.dmg' -type f | head -1)
          echo "→ verifying $DMG"
          spctl --assess -vv --type install "$DMG"
          # Hard-require the staple ticket — without it, offline users hit
          # Gatekeeper.
          xcrun stapler validate "$DMG"

      - name: create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Liquid Clips ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            **What's new**
            See [CHANGELOG.md](./CHANGELOG.md) for full details.

            **Install**
            1. Download `Liquid.Clips_*_aarch64.dmg` for Apple Silicon or `Liquid.Clips_*_x86_64.dmg` for Intel
            2. Open the DMG, drag **Liquid Clips** to **Applications**
            3. Double-click from Applications — the app is signed and notarized by Apple.
          files: |
            desktop-2/src-tauri/target/**/bundle/dmg/Liquid.Clips_*.dmg
            desktop-2/src-tauri/target/**/bundle/macos/Liquid.Clips_*.app.tar.gz
            desktop-2/src-tauri/target/**/bundle/macos/Liquid.Clips_*.app.tar.gz.sig

  # 2026-07-08 · v2.2.35 · flip DRAFT release to Latest.
  #
  # publish-tauri creates the release with `draft: true`. This job is the
  # gated promotion step — no one downloads the DMG (and no updater
  # manifest publish fires) until this job runs and succeeds.
  #
  # Gate strategy (Daniel-configurable, see REPORT.md):
  #   · Preferred · GitHub Environments with `production` + required
  #     reviewers. Uncomment the `environment:` line below AFTER Daniel
  #     confirms the repo tier supports required-reviewers.
  #   · Fallback (default here) · workflow_dispatch with `flip_tag`. The
  #     job only fires when a maintainer manually re-runs the workflow
  #     against the tag they want to promote. Tag pushes only produce a
  #     draft; nothing goes Latest without a second human step.
  flip-to-latest:
    # No `needs:` — flip runs on workflow_dispatch AFTER a prior tag-push
    # run has landed the draft. Splitting the trigger is the whole point
    # of the gate.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.flip_tag != '' }}
    runs-on: ubuntu-latest
    # environment: production   # <-- enable once GitHub Environments w/ required reviewers is provisioned
    permissions:
      contents: write
    outputs:
      flipped_tag: ${{ steps.flip.outputs.flipped_tag }}
    steps:
      - name: flip draft release to Latest
        id: flip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLIP_TAG: ${{ inputs.flip_tag }}
        run: |
          set -euo pipefail
          if [ -z "${FLIP_TAG:-}" ]; then
            echo "✗ flip_tag input is empty" >&2
            exit 1
          fi
          echo "→ flipping draft release $FLIP_TAG to Latest"
          # gh release edit clears `draft` and sets latest=true in one call.
          gh release edit "$FLIP_TAG" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
          echo "flipped_tag=$FLIP_TAG" >> "$GITHUB_OUTPUT"
          echo "✓ $FLIP_TAG is now the Latest release"

  # 2026-07-08 · publish updater manifest automatically after the release
  # is flipped to Latest. Pulls both .sig contents (aarch64 + x86_64) from
  # the released assets, builds the manifest JSON, POSTs to Railway
  # backend to update the static manifest.
  #
  # v2.2.35 · gated on `flip-to-latest` so a draft release NEVER produces
  # a live updater manifest. This is the single biggest lever against
  # "half-published" releases where GitHub has assets but installed
  # clients can't self-update yet.
  publish-manifest:
    needs: flip-to-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.flip_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.flip-to-latest.outputs.flipped_tag }}
    steps:
      - name: wait for release assets to settle
        run: sleep 30

      - name: pull sigs from GitHub release
        id: sigs
        run: |
          set -euo pipefail
          VERSION="${TAG#desktop-2-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          curl -sLf -o /tmp/sig-arm64.sig  "$BASE/Liquid.Clips_aarch64.app.tar.gz.sig"
          curl -sLf -o /tmp/sig-x64.sig    "$BASE/Liquid.Clips_x86_64.app.tar.gz.sig"
          SIG_ARM=$(cat /tmp/sig-arm64.sig | base64 -w0)
          SIG_X64=$(cat /tmp/sig-x64.sig | base64 -w0)
          echo "sig_arm=$SIG_ARM"  >> "$GITHUB_OUTPUT"
          echo "sig_x64=$SIG_X64"  >> "$GITHUB_OUTPUT"
          echo "✓ pulled both sigs · arm=${#SIG_ARM}B x64=${#SIG_X64}B"

      - name: build + POST manifest to backend
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          SIG_ARM: ${{ steps.sigs.outputs.sig_arm }}
          SIG_X64: ${{ steps.sigs.outputs.sig_x64 }}
          VERSION: ${{ steps.sigs.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Sigs are base64 blobs on the wire · backend decodes before serving.
          MANIFEST=$(jq -cn \
            --arg version "$VERSION" \
            --arg pub_date "$NOW" \
            --arg url_arm "$BASE/Liquid.Clips_aarch64.app.tar.gz" \
            --arg url_x64 "$BASE/Liquid.Clips_x86_64.app.tar.gz" \
            --arg sig_arm_b64 "$SIG_ARM" \
            --arg sig_x64_b64 "$SIG_X64" \
            '{
              version: $version,
              notes: "See release notes on GitHub.",
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: ($sig_arm_b64 | @base64d), url: $url_arm },
                "darwin-x86_64":  { signature: ($sig_x64_b64 | @base64d), url: $url_x64  }
              }
            }')
          # POST to backend admin endpoint that persists to the same
          # env-var source updates.py already reads.
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.liquidclips.app/admin/updates/publish-manifest" \
            -H "content-type: application/json" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -d "$MANIFEST" || true)
          CODE=$(printf '%s' "$RESP" | tail -1)
          if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
            echo "✓ manifest published to backend · HTTP $CODE"
          else
            echo "✗ manifest publish failed · HTTP $CODE"
            echo "$RESP" | head -20
            # Do NOT fail the whole release · the dmgs are already on
            # GitHub. Emit a clear signal so ops can hand-publish if
            # needed · release still ships.
            echo "::warning::updater manifest not published · check /admin/updates/publish-manifest"
          fi

      - name: verify live manifest returns new version
        env:
          VERSION: ${{ steps.sigs.outputs.version }}
        run: |
          set -euo pipefail
          for arch in darwin-aarch64 darwin-x86_64; do
            RESP=$(curl -sS "https://updates.liquidclips.app/latest.json?target=${arch}&current_version=0.0.0" || true)
            SERVED=$(echo "$RESP" | jq -r '.version // "?"')
            if [ "$SERVED" = "$VERSION" ]; then
              echo "✓ ${arch} · manifest reports v$SERVED"
            else
              echo "::warning::${arch} · manifest reports v$SERVED · expected v$VERSION · manual bump needed"
            fi
          done
