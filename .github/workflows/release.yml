# ───── IRON GATE IG-013 (v0.7.50) — see desktop/docs/IRON_GATES.md ─────
# Apple notarisation orchestrator. Paired with desktop/scripts/notarize.sh.
# The 5 secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID,
# APPLE_PASSWORD, APPLE_TEAM_ID) on Powstit/liquidclips are the source of
# truth — set 2026-06-02. NEVER swap apple-actions/import-codesign-certs@v3
# for an unversioned ref. NEVER drop `--options runtime --timestamp` from
# the codesign pass. Hardened runtime is mandatory; Apple rejects without it.

name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Per-arch native jobs. Mac entries run on Apple runners and follow the
        # IG-013 notarisation chain (codesign + notarytool + stapler). Windows
        # + Linux entries (added 2026-06-24 Sprint C — multi-platform launch)
        # are file-disjoint from the Apple path: every Apple-specific step is
        # gated `if: matrix.target.os_kind == 'mac'` so Windows/Linux runners
        # skip them entirely. Windows ships UNSIGNED until Daniel procures an
        # EV cert — see desktop/CLAUDE.md "Windows + Linux release path".
        target:
          - runner: macos-latest
            arch: aarch64
            rust_target: aarch64-apple-darwin
            slug: aarch64
            os_kind: mac
          # GitHub deprecated/retired macos-13 Intel capacity; use the
          # supported standard Intel image so x86_64 releases do not sit
          # queued until the run is cancelled.
          - runner: macos-15-intel
            arch: x86_64
            rust_target: x86_64-apple-darwin
            slug: x86_64
            os_kind: mac
          - runner: windows-latest
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            os_kind: windows
          - runner: ubuntu-latest
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            os_kind: linux
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable (mac — both Apple targets for lipo)
        if: matrix.target.os_kind == 'mac'
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal builds need BOTH targets so lipo can combine them.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install Rust stable (windows/linux — single native target)
        if: matrix.target.os_kind != 'mac'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      # Linux Tauri needs system libs (webkit2gtk, librsvg, libayatana-appindicator
      # for tray, libsoup for HTTP, libssl). AppImage bundling also needs file +
      # squashfs-tools. Run BEFORE npm install so any native-build node modules
      # have their headers available.
      - name: install Linux Tauri system dependencies
        if: matrix.target.os_kind == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            patchelf \
            file \
            squashfs-tools \
            build-essential \
            curl \
            wget

      - name: install frontend dependencies
        run: npm install
        working-directory: ./desktop

      - name: verify updater signing key matches tauri pubkey
        if: matrix.target.os_kind == 'mac'
        working-directory: ./desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          brew install minisign
          CANARY="$(mktemp)"
          PUBKEY_FILE="$(mktemp)"
          SIG_FILE="$(mktemp)"
          printf 'liquid-clips-updater-key-check\n' > "$CANARY"
          npx tauri signer sign "$CANARY"
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); fs.writeFileSync(process.argv[1], Buffer.from(c.plugins.updater.pubkey, 'base64'));" "$PUBKEY_FILE"
          base64 -d -i "$CANARY.sig" > "$SIG_FILE"
          minisign -Vm "$CANARY" -x "$SIG_FILE" -p "$PUBKEY_FILE"
          EXPECTED='B1E037066BFCE444'
          ACTUAL="$(sed -n 's/^untrusted comment: minisign public key: //p' "$PUBKEY_FILE" | tr -d '[:space:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "✗ updater pubkey fingerprint mismatch: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi
          echo "✓ updater signing secret matches tauri pubkey $ACTUAL"

      # Sidecar binaries are .gitignored (ffmpeg 76MB, ffprobe 76MB,
      # whisper-tiny 75MB) so CI must fetch them before the Tauri build — the
      # bundle.resources entries in tauri.conf.json hard-require these paths.
      # Falling back to brew + huggingface_hub keeps the workflow
      # self-contained (no third-party CDN auth, no LFS).
      - name: fetch ffmpeg + ffprobe (mac sidecar binaries via brew)
        if: matrix.target.os_kind == 'mac'
        run: |
          set -euo pipefail
          mkdir -p desktop/python-sidecar/bin
          # Per-arch native fetch — each matrix runner pulls the brew ffmpeg
          # matching its own architecture. arm64 runner → arm64 binary;
          # x86_64 runner → x86_64 binary. The DMG built on this runner
          # therefore ships a native sidecar.
          brew install ffmpeg
          cp -f "$(brew --prefix)/bin/ffmpeg"  desktop/python-sidecar/bin/ffmpeg
          cp -f "$(brew --prefix)/bin/ffprobe" desktop/python-sidecar/bin/ffprobe
          chmod +x desktop/python-sidecar/bin/ffmpeg desktop/python-sidecar/bin/ffprobe
          file desktop/python-sidecar/bin/ffmpeg
          ls -lah desktop/python-sidecar/bin/

      - name: fetch ffmpeg + ffprobe (linux sidecar binaries via apt)
        if: matrix.target.os_kind == 'linux'
        run: |
          set -euo pipefail
          mkdir -p desktop/python-sidecar/bin
          sudo apt-get install -y ffmpeg
          cp -f "$(command -v ffmpeg)"  desktop/python-sidecar/bin/ffmpeg
          cp -f "$(command -v ffprobe)" desktop/python-sidecar/bin/ffprobe
          chmod +x desktop/python-sidecar/bin/ffmpeg desktop/python-sidecar/bin/ffprobe
          file desktop/python-sidecar/bin/ffmpeg
          ls -lah desktop/python-sidecar/bin/

      - name: fetch ffmpeg + ffprobe (windows sidecar binaries via gyan.dev)
        if: matrix.target.os_kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path desktop/python-sidecar/bin | Out-Null
          # gyan.dev publishes static ffmpeg builds for Windows under a stable
          # "essentials" name. The release_xxx archive contains ffmpeg.exe +
          # ffprobe.exe at known paths. We pin to the "essentials" stable build
          # so future ffmpeg majors don't silently change CLI flags.
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-extracted" -Force
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $probe = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg-extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $exe -or -not $probe) { throw "ffmpeg/ffprobe not found in archive" }
          Copy-Item -Force $exe.FullName desktop/python-sidecar/bin/ffmpeg.exe
          Copy-Item -Force $probe.FullName desktop/python-sidecar/bin/ffprobe.exe
          # Tauri bundle.resources still references unsuffixed names; mirror
          # them too so the bundler finds the file regardless of platform path.
          Copy-Item -Force $exe.FullName desktop/python-sidecar/bin/ffmpeg
          Copy-Item -Force $probe.FullName desktop/python-sidecar/bin/ffprobe
          Get-ChildItem desktop/python-sidecar/bin/

      - name: fetch faster-whisper-tiny model
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          import shutil, os
          dest = "desktop/python-sidecar/models/faster-whisper-tiny"
          os.makedirs(dest, exist_ok=True)
          src = snapshot_download(
              repo_id="Systran/faster-whisper-tiny",
              allow_patterns=["config.json", "model.bin", "tokenizer.json", "vocabulary.txt"],
          )
          for fname in ("config.json", "model.bin", "tokenizer.json", "vocabulary.txt"):
              shutil.copy(os.path.join(src, fname), os.path.join(dest, fname))
          PY
          ls -lah desktop/python-sidecar/models/faster-whisper-tiny/

      # xattr strip: prevents codesign "resource fork" failure on bundled files
      # that were fetched from brew/huggingface and carry macOS quarantine/Finder metadata.
      - name: strip extended attributes from bundled files
        if: matrix.target.os_kind == 'mac'
        run: |
          set -euo pipefail
          xattr -cr desktop/python-sidecar/bin/
          xattr -cr desktop/python-sidecar/models/
          xattr -cr desktop/python-sidecar/*.py
          xattr -cr desktop/src/
          # desktop/public/ + desktop/assets/ may not exist on every build;
          # tolerate the absence so set -e doesn't abort.
          xattr -cr desktop/public/ 2>/dev/null || true
          xattr -cr desktop/assets/ 2>/dev/null || true
          xattr -cr desktop/src-tauri/icons/
          xattr -cr desktop/src-tauri/entitlements*
          xattr -cr desktop/src-tauri/*.xcprivacy
          xattr -cr desktop/src-tauri/target/release/ 2>/dev/null || true
          echo "✓ xattrs stripped"

      - name: import Developer ID certificate
        if: matrix.target.os_kind == 'mac'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # apple-actions/import-codesign-certs creates signing_temp.keychain but
      # doesn't always add it to codesign's search list — so `codesign --sign
      # "Developer ID Application: ..."` returns "no identity found" even
      # though the cert is imported. Force the keychain to the front of the
      # user search list and dump identities so we can confirm what's loaded.
      - name: register codesign keychain + verify identity
        if: matrix.target.os_kind == 'mac'
        run: |
          set -euo pipefail
          security list-keychains -d user -s signing_temp.keychain login.keychain
          security default-keychain -d user -s signing_temp.keychain || true
          security set-keychain-settings -lut 21600 signing_temp.keychain
          echo "--- identities visible to codesign ---"
          security find-identity -v -p codesigning
          echo "--- Developer ID identities ---"
          security find-identity -v -p codesigning | grep -i "Developer ID" || echo "(no Developer ID match)"

      # Apple's notarizer independently validates nested executables inside
      # the .app, so re-sign the bundled sidecar binaries with the Developer
      # ID + secure timestamp + hardened runtime BEFORE Tauri copies them
      # into the bundle. Tolerant of missing optional binaries (e.g.
      # junior-face-detect is a local-only Swift binary, not fetched in CI).
      - name: sign sidecar helper binaries
        if: matrix.target.os_kind == 'mac'
        run: |
          set -euo pipefail
          IDENTITY='Developer ID Application: daniel diyepriye dokubo (KT68NGT4LX)'
          codesign_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if codesign "$@"; then
                return 0
              fi
              echo "codesign failed on attempt $attempt; retrying after timestamp service backoff..." >&2
              sleep $((attempt * 10))
            done
            codesign "$@"
          }
          for bin in \
            desktop/python-sidecar/bin/ffmpeg \
            desktop/python-sidecar/bin/ffprobe \
            desktop/python-sidecar/bin/junior-face-detect
          do
            if [ ! -f "$bin" ]; then
              echo "(skip) missing optional sidecar binary: $bin"
              continue
            fi
            echo "Signing $bin"
            codesign_with_retry --force --options runtime --timestamp --sign "$IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          echo "✓ sidecar binaries signed"

      - name: build signed macOS app
        if: matrix.target.os_kind == 'mac'
        working-directory: ./desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # Per-arch native build. Each matrix runner builds its own slice; the
        # brew sidecar fetched earlier in this job is the matching arch. We do
        # not lipo a universal binary — instead we publish two DMGs.
        run: npm run tauri -- build --target ${{ matrix.target.rust_target }} --bundles app

      - name: repair-sign macOS app bundle
        if: matrix.target.os_kind == 'mac'
        run: |
          set -euo pipefail
          APP=$(find desktop/src-tauri/target -path '*/bundle/macos/Liquid Clips.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "✗ No Liquid Clips.app bundle found" >&2
            exit 1
          fi
          desktop/scripts/sign-clean-macos-app.sh "$APP"

      - name: rebuild DMG + updater tarball from repaired app
        if: matrix.target.os_kind == 'mac'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP=$(find desktop/src-tauri/target -path '*/bundle/macos/Liquid Clips.app' -type d | head -1)
          # Delete the stale tauri-default DMG (with space, unsigned container) before
          # rebuild so notarize.sh + upload glob only see the slugged + re-signed DMG.
          # Without this, v0.7.50 shipped an unstapled DMG because `find | head -1`
          # picked the unsigned tauri DMG and the upload glob uploaded a non-notarised file.
          find desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -type f -delete || true
          desktop/scripts/package-signed-macos-artifacts.sh "$APP" ${{ matrix.target.slug }}

      - name: notarize and staple .dmg
        if: matrix.target.os_kind == 'mac'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(find desktop/src-tauri/target -path '*/bundle/dmg/Liquid.Clips_*.dmg' -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "✗ No rebuilt .dmg found at bundle/dmg/Liquid.Clips_*.dmg" >&2
            exit 1
          fi
          echo "→ notarising $DMG"
          desktop/scripts/notarize.sh "$DMG"

      - name: verify notarized installer
        if: matrix.target.os_kind == 'mac'
        run: |
          set -euo pipefail
          DMG=$(find desktop/src-tauri/target -path '*/bundle/dmg/Liquid.Clips_*.dmg' -type f | head -1)
          echo "→ verifying $DMG"
          spctl --assess -vv --type install "$DMG"
          # Hard-require the staple ticket — without it, offline users hit Gatekeeper.
          xcrun stapler validate "$DMG"

      # ── Windows build ────────────────────────────────────────────────────
      # Tauri 2 supports both NSIS (consumer-friendly, smaller, classic
      # installer) and MSI / WiX (enterprise-friendly, group-policy
      # deployable). We ship BOTH so individual users grab .exe (nsis) and
      # IT admins grab .msi.
      #
      # CODE-SIGNING: Gated behind the `WINDOWS_CERT_AVAILABLE` repo variable.
      # When `true`, the signed-build step runs and Tauri's bundler picks up
      # the cert via tauri.conf.json `windows.certificateThumbprint`. When
      # NOT set (the current state — Daniel has not procured an EV cert),
      # the unsigned-build step runs and SmartScreen warns on launch. Users
      # click "More info" → "Run anyway". Documented on the download page +
      # in desktop/CLAUDE.md.
      - name: build Windows installers (signed)
        if: matrix.target.os_kind == 'windows' && vars.WINDOWS_CERT_AVAILABLE == 'true'
        working-directory: ./desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # cert thumbprint passed through tauri.conf.json windows.certificateThumbprint;
          # exposed here so a future EV-cert import step can stage the .pfx into the
          # runner's user store before bundling.
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: npm run tauri -- build --target ${{ matrix.target.rust_target }} --bundles nsis,msi

      - name: build Windows installers (unsigned — SmartScreen will warn)
        if: matrix.target.os_kind == 'windows' && vars.WINDOWS_CERT_AVAILABLE != 'true'
        working-directory: ./desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npm run tauri -- build --target ${{ matrix.target.rust_target }} --bundles nsis,msi

      - name: verify Windows installers built
        if: matrix.target.os_kind == 'windows'
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path desktop/src-tauri/target -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem -Path desktop/src-tauri/target -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS .exe not produced"; exit 1 }
          if (-not $msi) { Write-Error "MSI not produced"; exit 1 }
          Write-Output "nsis: $($nsis.FullName)"
          Write-Output "msi:  $($msi.FullName)"

      # ── Linux build ──────────────────────────────────────────────────────
      # .deb for apt-installable consumer use (Debian/Ubuntu family).
      # .AppImage for distro-agnostic portable use (anything glibc ≥ 2.31).
      # No signing on Linux — AppImage embeds a sha, .deb is signed by the
      # repo if hosted in one. We ship raw artifacts; users verify by sha
      # alongside the release page.
      - name: build Linux installers (deb + appimage)
        if: matrix.target.os_kind == 'linux'
        working-directory: ./desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npm run tauri -- build --target ${{ matrix.target.rust_target }} --bundles deb,appimage

      - name: verify Linux installers built
        if: matrix.target.os_kind == 'linux'
        run: |
          set -euo pipefail
          DEB=$(find desktop/src-tauri/target -path '*/bundle/deb/*.deb' -type f | head -1 || true)
          APPIMG=$(find desktop/src-tauri/target -path '*/bundle/appimage/*.AppImage' -type f | head -1 || true)
          if [ -z "$DEB" ]; then echo "✗ .deb not produced" >&2; exit 1; fi
          if [ -z "$APPIMG" ]; then echo "✗ .AppImage not produced" >&2; exit 1; fi
          echo "deb:      $DEB"
          echo "appimage: $APPIMG"

      - name: create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Liquid Clips ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            **What's new**
            See [CHANGELOG.md](./CHANGELOG.md) for full details.

            **Install — Mac**
            1. Download `Liquid.Clips_*_aarch64.dmg` for Apple Silicon or `Liquid.Clips_*_x86_64.dmg` for Intel
            2. Open the DMG, drag **Liquid Clips** to **Applications**
            3. Double-click from Applications — the app is signed and notarized by Apple.

            **Install — Windows**
            1. Download `*-setup.exe` (NSIS, recommended) or `*.msi` (MSI, enterprise)
            2. Run the installer. SmartScreen may warn ("Microsoft Defender SmartScreen prevented an unrecognized app from starting") — click **More info** → **Run anyway**. (We are working on an EV code-signing cert to remove this prompt.)
            3. Launch **Liquid Clips** from the Start menu.

            **Install — Linux**
            1. Download `*.AppImage` (portable, no install) or `*.deb` (Debian/Ubuntu apt-installable)
            2. AppImage: `chmod +x Liquid.Clips_*.AppImage && ./Liquid.Clips_*.AppImage`
            3. .deb: `sudo apt install ./liquid-clips_*.deb`
          files: |
            desktop/src-tauri/target/**/bundle/dmg/Liquid.Clips_*.dmg
            desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/**/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/**/bundle/nsis/*-setup.nsis.zip
            desktop/src-tauri/target/**/bundle/nsis/*-setup.nsis.zip.sig
            desktop/src-tauri/target/**/bundle/msi/*.msi
            desktop/src-tauri/target/**/bundle/msi/*.msi.zip
            desktop/src-tauri/target/**/bundle/msi/*.msi.zip.sig
            desktop/src-tauri/target/**/bundle/deb/*.deb
            desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/bundle/appimage/*.AppImage.tar.gz
            desktop/src-tauri/target/**/bundle/appimage/*.AppImage.tar.gz.sig
