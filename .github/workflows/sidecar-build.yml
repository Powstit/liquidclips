name: sidecar-build

# Dedicated workflow that builds the Python sidecar bundle (PyInstaller
# --onedir) per arch and uploads the result as a downloadable artifact.
# Split out from release-desktop-2.yml so the sidecar can iterate on its
# own cadence (Phase 2 · Anthropic clip judge lands here 2026-07-09) and
# so a broken sidecar rebuild doesn't stall a native release.
#
# Trigger: manual dispatch only. Consumers hot-swap the downloaded bundle
# into /Applications/Liquid Clips.app/Contents/Resources/_up_/_up_/python-sidecar/dist/sidecar-bundle/
# for a fast-fix loop; the next release-desktop-2 run integrates the same
# artifact into a full DMG (integration lands after this workflow has a
# green-run receipt).
#
# Matrix mirrors release-desktop-2.yml so signed Mach-O binaries produced
# here can be dropped into either shipped installer without recodesigning
# for a mismatched arch.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Short note that shows in the artifact filename'
        required: false
        default: 'phase2-anthropic'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      # Regression guard · 2026-07-09 (RPC JWT injection · Daniel's approved fix)
      # Rule: hosted-mode sidecar must never keychain-read on the clip-run hot
      # path. All keychain access is centralised in secrets_store.py and gated
      # via assert_hosted_may_read(). Any new callsite outside that module is
      # a regression — fail the build before the artifact ever ships.
      - name: guard · no keychain reads outside secrets_store.py
        run: |
          set -euo pipefail
          # Allowed to reference the pattern in strings + docstrings:
          #  · secrets_store.py (the ONE gated wrapper module)
          #  · tests/ (the regression test monkey-patches keyring.get_password)
          bad=$(git grep -n -E "keyring\.get_password|security find-generic-password" python-sidecar/ \
            | grep -v -E "^python-sidecar/(secrets_store\.py|tests/)" \
            || true)
          if [ -n "$bad" ]; then
            echo "✗ keychain read outside secrets_store.py:"
            echo "$bad"
            echo ""
            echo "Fix: route the call through secrets_store.get_secret() so"
            echo "assert_hosted_may_read() can gate it. See secrets_store.py"
            echo "header comment for the keychain gate protocol."
            exit 1
          fi
          echo "✓ zero keychain callsites outside secrets_store.py + tests/"

      - name: setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ffmpeg + ffprobe are gitignored (~76MB each). Same fetch pattern as
      # release-desktop-2.yml so the build_sidecar.sh smoke test passes.
      - name: fetch ffmpeg + ffprobe
        run: |
          set -euo pipefail
          mkdir -p python-sidecar/bin
          brew install ffmpeg
          cp -f "$(brew --prefix)/bin/ffmpeg"  python-sidecar/bin/ffmpeg
          cp -f "$(brew --prefix)/bin/ffprobe" python-sidecar/bin/ffprobe
          chmod +x python-sidecar/bin/ffmpeg python-sidecar/bin/ffprobe
          file python-sidecar/bin/ffmpeg

      # whisper-tiny is gitignored (75MB). Same fetch pattern as release.
      - name: fetch faster-whisper-tiny model
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          import shutil, os
          dest = "python-sidecar/models/faster-whisper-tiny"
          os.makedirs(dest, exist_ok=True)
          src = snapshot_download(
              repo_id="Systran/faster-whisper-tiny",
              allow_patterns=["config.json", "model.bin", "tokenizer.json", "vocabulary.txt"],
          )
          for fname in ("config.json", "model.bin", "tokenizer.json", "vocabulary.txt"):
              shutil.copy(os.path.join(src, fname), os.path.join(dest, fname))
          PY
          ls -lah python-sidecar/models/faster-whisper-tiny/

      - name: create sidecar venv + install deps
        working-directory: python-sidecar
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller pytest
          .venv/bin/python -c "import faster_whisper, ctranslate2, tokenizers, openai, anthropic, keyring, yt_dlp, pydantic; print('all imports ok')"

      # Regression guard · 2026-07-09 · hosted-mode zero-keychain test.
      # Runs BEFORE the build so a broken guard blocks the artifact.
      - name: guard · hosted-mode zero-keychain unit test
        working-directory: python-sidecar
        run: .venv/bin/python -m pytest tests/test_no_keychain_in_hosted.py -v

      - name: build sidecar bundle (PyInstaller --onedir)
        working-directory: python-sidecar
        # build_sidecar.sh --arch matches host arch on each matrix runner.
        run: bash build_sidecar.sh --arch ${{ matrix.target.arch }}

      - name: bundle stats
        run: |
          set -euo pipefail
          BUNDLE=python-sidecar/dist/sidecar-bundle
          test -d "$BUNDLE" || { echo "✗ sidecar-bundle missing"; exit 1; }
          test -x "$BUNDLE/liquid-clips-sidecar" || { echo "✗ sidecar binary not built"; exit 1; }
          echo "── sidecar bundle stats ──"
          du -sh "$BUNDLE"
          find "$BUNDLE" -type f | wc -l | awk '{print $1" files"}'
          codesign -dvv "$BUNDLE/liquid-clips-sidecar" 2>&1 | head -6 || true
          echo "── anthropic present? ──"
          find "$BUNDLE/_internal" -name "anthropic*" -maxdepth 3 | head -5

      - name: upload sidecar-bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-bundle-${{ matrix.target.arch }}-${{ inputs.note }}
          path: python-sidecar/dist/sidecar-bundle/
          if-no-files-found: error
          retention-days: 14
