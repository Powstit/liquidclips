name: runtime-canary-publish

# One-off runtime bundle publisher. Builds the current desktop-2 dist,
# injects a canary marker into index.html, packs+signs with the CI's
# unpassphrased TAURI_SIGNING_PRIVATE_KEY, uploads to /runtime/upload,
# and promotes to PASS so /runtime/manifest.json starts serving it.
#
# Manual dispatch only. Zero effect on native shell CI or releases.

on:
  workflow_dispatch:
    inputs:
      canary_string:
        description: 'Canary marker string (visible in index.html title + meta tag)'
        required: true
        default: 'RUNTIME_CANARY_2026_07_08'
      bundle_version:
        description: 'Runtime bundle version (must be unique · e.g. 2.2.36-canary)'
        required: true
        default: '2.2.36-canary'
      channel:
        description: 'Channel'
        required: false
        default: 'stable'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node lts
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install desktop-2 deps (npm, matches release workflow)
        working-directory: ./desktop-2
        run: npm install

      - name: build vite bundle
        working-directory: ./desktop-2
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BACKEND_URL: https://api.liquidclips.app
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: inject UNMISSABLE canary banner + JS overlay into index.html
        run: |
          set -euo pipefail
          IDX="desktop-2/dist/index.html"
          CANARY="${{ github.event.inputs.canary_string }}"
          VERSION="${{ github.event.inputs.bundle_version }}"

          # Backup
          cp "$IDX" "${IDX}.bak"

          # 1. Meta tag (inspector-visible)
          sed -i "s|<head>|<head>\n    <meta name=\"runtime-canary\" content=\"${CANARY}\">\n    <meta name=\"runtime-version\" content=\"${VERSION}\">|" "$IDX"

          # 2. Fixed banner across TOP of viewport · impossible to miss
          #    - top:0 · full width · 88px tall
          #    - hot-pink background · black bold text
          #    - z-index 2147483647 (max) so it beats every UI layer
          #    - pointer-events auto so it doesn't block clicks below
          #    - inline script writes it AFTER any React root render, so
          #      even if React clears the DOM the banner comes back
          BANNER='<div id="lc-runtime-canary-banner" style="position:fixed;top:0;left:0;right:0;height:88px;background:#ff2a8c;color:#000;font:900 24px/88px system-ui,sans-serif;text-align:center;letter-spacing:2px;z-index:2147483647;box-shadow:0 4px 24px rgba(255,42,140,0.5);border-bottom:4px solid #000">🐤 '"${CANARY}"' · v'"${VERSION}"' · RUNTIME CLOUD UPDATE PROOF 🐤</div><script>function _lcInjectCanary(){if(!document.getElementById("lc-runtime-canary-banner")){var d=document.createElement("div");d.id="lc-runtime-canary-banner";d.style.cssText="position:fixed;top:0;left:0;right:0;height:88px;background:#ff2a8c;color:#000;font:900 24px/88px system-ui,sans-serif;text-align:center;letter-spacing:2px;z-index:2147483647;box-shadow:0 4px 24px rgba(255,42,140,0.5);border-bottom:4px solid #000;pointer-events:auto";d.innerHTML="🐤 '"${CANARY}"' · v'"${VERSION}"' · RUNTIME CLOUD UPDATE PROOF 🐤";document.body.appendChild(d);}}document.addEventListener("DOMContentLoaded",_lcInjectCanary);setInterval(_lcInjectCanary,500);</script>'

          # 3. Inject banner at start of <body> AND rewrite </body> to re-inject if React strips it
          python3 -c "
          import sys
          with open('$IDX') as f: html = f.read()
          banner = '''$BANNER'''
          html = html.replace('<body>', '<body>' + banner, 1)
          with open('$IDX', 'w') as f: f.write(html)
          "

          # 4. Verify
          grep -q "lc-runtime-canary-banner" "$IDX" || { echo "✗ banner injection failed"; exit 1; }
          grep -c "${CANARY}" "$IDX" | xargs echo "canary occurrences:"
          echo "✓ unmissable pink banner injected · reinjects every 500ms via setInterval"

          # 5. Write VERSION file at bundle root so runtime.rs can read it
          echo -n "$VERSION" > desktop-2/dist/VERSION

      - name: pack bundle as tar.gz
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.bundle_version }}"
          BUNDLE_NAME="liquidclips-runtime-${VERSION}.tar.gz"

          # Pack dist/ contents at the root of archive (not the dist/ dir itself)
          tar -czf "${BUNDLE_NAME}" -C desktop-2/dist .

          SIZE=$(stat -c%s "${BUNDLE_NAME}")
          SHA256=$(sha256sum "${BUNDLE_NAME}" | cut -d' ' -f1)

          echo "BUNDLE_NAME=${BUNDLE_NAME}" >> $GITHUB_ENV
          echo "SHA256=${SHA256}" >> $GITHUB_ENV
          echo "bundle: ${BUNDLE_NAME}"
          echo "size:   $((SIZE / 1024 / 1024)) MB"
          echo "sha256: ${SHA256}"

      - name: install minisign
        run: |
          sudo apt-get install -y --no-install-recommends minisign 2>&1 | tail -3
          minisign -v

      - name: sign bundle with tauri signer (same as release workflow)
        working-directory: ./desktop-2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Copy bundle into desktop-2/ so npx tauri signer sees it.
          BUNDLE_PATH="../${BUNDLE_NAME}"
          test -f "$BUNDLE_PATH" || { echo "✗ bundle not at $BUNDLE_PATH"; exit 1; }

          # Use the exact same signing path as the release workflow's
          # "verify updater signing key matches tauri pubkey" step.
          # npx reads TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # from env. Empty password works because the CI key is unpassphrased.
          npx --yes @tauri-apps/cli signer sign "$BUNDLE_PATH"

          SIG_FILE="${BUNDLE_PATH}.sig"
          test -f "$SIG_FILE" || { echo "✗ signature file not created"; exit 1; }

          # Verify locally against the pubkey baked into tauri.conf.json
          PUBKEY_FILE=$(mktemp)
          node -e "
            const c=JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8'));
            const b64 = c.plugins?.updater?.pubkey;
            if (!b64) { console.error('no updater.pubkey'); process.exit(1); }
            require('fs').writeFileSync(process.argv[1], Buffer.from(b64, 'base64'));
          " "$PUBKEY_FILE"

          # tauri signer writes signatures base64-wrapped. Decode for minisign verify.
          DECODED_SIG=$(mktemp)
          base64 -d "$SIG_FILE" > "$DECODED_SIG"
          minisign -Vm "$BUNDLE_PATH" -x "$DECODED_SIG" -p "$PUBKEY_FILE"
          echo "✓ signed and verified locally"

          # Read the base64 signature file contents directly for the upload header.
          # (The .sig file IS already base64, matches the server contract.)
          SIGNATURE_B64=$(tr -d '\n' < "$SIG_FILE")
          echo "SIGNATURE_B64=${SIGNATURE_B64}" >> $GITHUB_ENV

          rm -f "$PUBKEY_FILE" "$DECODED_SIG"

      - name: upload bundle to /runtime/upload
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.bundle_version }}"
          CHANNEL="${{ github.event.inputs.channel }}"
          CANARY="${{ github.event.inputs.canary_string }}"

          echo "POSTing $(du -h "$BUNDLE_NAME" | cut -f1) to /runtime/upload..."

          UPLOAD_RESP=$(curl -sS --fail-with-body -X POST \
            "https://api.liquidclips.app/runtime/upload" \
            -H "x-internal-secret: ${INTERNAL_API_SECRET}" \
            -H "x-runtime-version: ${VERSION}" \
            -H "x-runtime-channel: ${CHANNEL}" \
            -H "x-runtime-signature: ${SIGNATURE_B64}" \
            -H "x-runtime-filename: ${BUNDLE_NAME}" \
            -H "x-runtime-notes: canary test bundle for ${CANARY}" \
            --data-binary "@${BUNDLE_NAME}")

          echo "upload response: $UPLOAD_RESP"

          # Verify sha256 matches
          SERVER_SHA=$(echo "$UPLOAD_RESP" | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d.toString()).sha256)}catch{console.log('parse-fail')}})")
          if [ "$SERVER_SHA" != "$SHA256" ]; then
            echo "✗ sha256 mismatch: local=$SHA256 server=$SERVER_SHA"
            exit 1
          fi
          echo "✓ upload OK · sha256 verified server-side"

      - name: promote bundle to PASS
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.bundle_version }}"

          PROMOTE_RESP=$(curl -sS --fail-with-body -X POST \
            "https://api.liquidclips.app/runtime/promote" \
            -H "x-internal-secret: ${INTERNAL_API_SECRET}" \
            -H "x-runtime-version: ${VERSION}" \
            -H "x-ship-lens-verdict: PASS" \
            -H "x-ship-lens-review-url: manual-canary-proof-2026-07-08")

          echo "promote response: $PROMOTE_RESP"

          VERDICT=$(echo "$PROMOTE_RESP" | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d.toString()).ship_lens_verdict)}catch{console.log('parse-fail')}})")
          if [ "$VERDICT" != "PASS" ]; then
            echo "✗ promote failed: verdict=$VERDICT"
            exit 1
          fi
          echo "✓ promoted to PASS"

      - name: verify manifest serves canary
        run: |
          set -euo pipefail
          sleep 2
          MANIFEST=$(curl -sS "https://api.liquidclips.app/runtime/manifest.json?channel=${{ github.event.inputs.channel }}&current_version=0.0.0")
          echo "manifest: $MANIFEST"

          MANIFEST_VERSION=$(echo "$MANIFEST" | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d.toString()).version)}catch{console.log('parse-fail')}})")
          if [ "$MANIFEST_VERSION" != "${{ github.event.inputs.bundle_version }}" ]; then
            echo "✗ manifest served wrong version: $MANIFEST_VERSION"
            exit 1
          fi
          echo "✓ manifest points at canary bundle"

      - name: verify bundle downloadable + sha256 matches
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.bundle_version }}"

          curl -sSL -o /tmp/dl.tar.gz "https://api.liquidclips.app/runtime/download/${VERSION}"
          DL_SHA=$(sha256sum /tmp/dl.tar.gz | cut -d' ' -f1)

          if [ "$DL_SHA" != "$SHA256" ]; then
            echo "✗ download sha256 mismatch: server=$DL_SHA local=$SHA256"
            exit 1
          fi
          echo "✓ bundle downloadable · sha256 matches"

      - name: final summary
        run: |
          echo "========================================"
          echo "✓ CANARY PUBLISHED SUCCESSFULLY"
          echo "  version: ${{ github.event.inputs.bundle_version }}"
          echo "  channel: ${{ github.event.inputs.channel }}"
          echo "  string:  ${{ github.event.inputs.canary_string }}"
          echo "  sha256:  $SHA256"
          echo "  manifest: https://api.liquidclips.app/runtime/manifest.json"
          echo "  bundle:   https://api.liquidclips.app/runtime/download/${{ github.event.inputs.bundle_version }}"
          echo "========================================"
